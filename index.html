<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍒 C. BANK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.jsdelivr.net/npm/vanilla-calendar-pro/build/vanilla-calendar.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vanilla-calendar-pro/build/vanilla-calendar.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* 🌟 修正 height: 100% 導致的捲動異常，改為 min-height */
        html, body { min-height: 100%; background-color: #f9fafb; touch-action: manipulation; overflow-x: hidden; }
        .hidden-view { display: none !important; }
        
        .vc-day { min-height: 65px !important; position: relative; padding-top: 4px; }
        .vanilla-calendar-day__btn { align-items: flex-start !important; justify-content: center !important; }
        .vanilla-calendar-day__btn_selected { background-color: #92A8D1 !important; color: white !important; box-shadow: 0 4px 10px rgba(146, 168, 209, 0.4) !important; }
        .vanilla-calendar-day__btn_today { color: #F7CAC9 !important; background-color: #FFF0F0 !important; }
        
        .day-cost { 
            position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: 8.5px; letter-spacing: -0.3px; font-weight: bold; 
            background: #F7CAC9; color: #4B5563; 
            border-radius: 4px; padding: 1px 3px; text-align: center; width: 90%; line-height: 1.1; white-space: nowrap; overflow: hidden; pointer-events: none; 
            box-shadow: 0 2px 4px rgba(247, 202, 201, 0.4);
        }
        .day-income { background: #92A8D1; color: #FFFFFF; box-shadow: 0 2px 4px rgba(146, 168, 209, 0.4); }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-gray-800 font-sans selection:bg-[#F7CAC9] selection:text-white pb-32">

    <div class="max-w-md mx-auto bg-gray-50 min-h-screen relative">
        
        <header class="bg-gradient-to-r from-[#92A8D1] to-[#F7CAC9] text-white p-5 text-center sticky top-0 z-40 shadow-md rounded-b-3xl border-b-4 border-white/30">
            <h1 class="text-2xl font-black tracking-widest drop-shadow-md flex justify-center items-center gap-2">
                <span>🍒</span> C. BANK
            </h1>
        </header>

        <main id="view-calendar" class="p-4">
            <div class="bg-white rounded-[24px] shadow-sm border border-gray-100 p-3 mb-4">
                <div id="calendar" class="w-full mb-1"></div>
                <div class="flex justify-end px-2 mb-2">
                    <div class="bg-gray-100 p-0.5 rounded-md flex text-[10px] font-bold">
                        <button id="btn-cal-twd" onclick="changeCalendarCurrency('TWD')" class="px-2 py-1 rounded bg-white text-[#92A8D1] shadow-sm transition-all">NT$</button>
                        <button id="btn-cal-krw" onclick="changeCalendarCurrency('KRW')" class="px-2 py-1 text-gray-400 transition-all">₩</button>
                    </div>
                </div>
                <div class="flex justify-around items-center text-sm pt-3 border-t border-gray-100">
                    <div class="text-center w-1/2 border-r border-gray-100">
                        <div class="text-[10px] text-gray-400 font-bold tracking-wider mb-1">本月總支出</div>
                        <div id="month-total-expense" class="font-black text-[#92A8D1] text-base">NT$ 0</div>
                    </div>
                    <div class="text-center w-1/2">
                        <div class="text-[10px] text-gray-400 font-bold tracking-wider mb-1">本月總收入</div>
                        <div id="month-total-income" class="font-black text-green-500 text-base">NT$ 0</div>
                    </div>
                </div>
            </div>
            <div id="daily-details-container" class="space-y-3 pb-6 overflow-hidden"></div>
        </main>

        <main id="view-stats" class="p-4 hidden-view">
            <div class="bg-white rounded-[24px] shadow-sm border border-gray-100 p-5 mb-4">
                <div class="flex justify-between items-end mb-2">
                    <h3 class="text-xs font-black text-gray-400 uppercase tracking-wider">🎯 本月預算狀態</h3>
                    <span class="text-[10px] font-bold text-gray-500">NT$ <span id="budget-text">0 / 20,000</span></span>
                </div>
                <div class="w-full bg-gray-100 rounded-full h-3.5 mb-1 overflow-hidden">
                    <div id="budget-bar" class="h-full rounded-full transition-all duration-700 w-0 bg-gradient-to-r from-[#92A8D1] to-[#F7CAC9]"></div>
                </div>
                <div class="text-[9px] text-right font-black text-gray-400 mb-3" id="budget-percentage">0%</div>
                <div class="text-xs font-bold text-[#6A85B6] bg-[#E8EEF9] p-2.5 rounded-xl text-center transition-all duration-500" id="budget-message">
                    🍒 載入中...
                </div>
            </div>

            <div class="bg-white rounded-[24px] shadow-sm border border-gray-100 p-5">
                <div class="flex justify-between items-center mb-4">
                    <button onclick="changeStatsMonth(-1)" class="p-2 text-gray-400 hover:text-[#92A8D1] rounded-full font-bold transition-colors">&lt;</button>
                    <h2 id="stats-month-label" class="text-lg font-bold text-gray-800">2026 / 07</h2>
                    <button onclick="changeStatsMonth(1)" class="p-2 text-gray-400 hover:text-[#92A8D1] rounded-full font-bold transition-colors">&gt;</button>
                </div>
                <div class="flex justify-center mb-6">
                    <div class="bg-gray-100 p-1 rounded-lg flex text-sm font-bold shadow-inner">
                        <button id="btn-stats-twd" onclick="changeStatsCurrency('TWD')" class="px-5 py-1.5 rounded-md bg-white text-[#92A8D1] shadow transition-all">台幣 NT$</button>
                        <button id="btn-stats-krw" onclick="changeStatsCurrency('KRW')" class="px-5 py-1.5 rounded-md text-gray-400 transition-all">韓元 ₩</button>
                    </div>
                </div>
                <div class="relative w-52 h-52 mx-auto mb-6">
                    <canvas id="myDonutChart" class="absolute inset-0 z-10"></canvas>
                    <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none z-0 mt-2">
                        <div id="stats-total-label" class="text-[10px] text-gray-500 font-bold mb-0.5">總支出</div>
                        <div id="stats-total-text" class="text-xl font-black text-gray-800">0</div>
                    </div>
                </div>
                <div id="stats-list" class="space-y-3 mt-4 border-t pt-4"></div>
            </div>
        </main>

        <main id="view-wallet" class="p-4 hidden-view">
            <div class="bg-white rounded-[24px] shadow-sm border border-gray-100 p-5">
                <div class="flex justify-between items-center mb-6">
                    <button onclick="changeWalletMonth(-1)" class="p-2 text-gray-400 hover:text-[#92A8D1] rounded-full font-bold transition-colors">&lt;</button>
                    <h2 id="wallet-month-label" class="text-lg font-bold text-gray-800">2026 / 07</h2>
                    <button onclick="changeWalletMonth(1)" class="p-2 text-gray-400 hover:text-[#92A8D1] rounded-full font-bold transition-colors">&gt;</button>
                </div>
                <h3 class="text-xs font-black text-gray-400 mb-4 uppercase tracking-wider px-1">本月各付款方式總額</h3>
                <div id="wallet-list" class="space-y-3"></div>
            </div>
        </main>

        <main id="view-tools" class="p-4 hidden-view">
            <div class="bg-white rounded-[24px] shadow-sm border border-gray-100 p-5 min-h-[70vh]">
                <h2 class="text-lg font-black text-gray-800 mb-4 bg-gradient-to-r from-[#92A8D1] to-[#F7CAC9] bg-clip-text text-transparent flex items-center gap-2">
                    <span>💎</span> 歡迎來到克拉島

                <div class="relative mb-6">

                    <span class="absolute left-4 top-3.5 text-gray-400">🔍</span>
                </div>
                <div id="search-results-list" class="space-y-3 pb-6 hidden-view overflow-hidden"></div>

                <div id="tools-menu" class="space-y-3">
                    <h3 class="text-xs font-black text-gray-400 mb-2 mt-4 uppercase tracking-wider px-1">克拉必備小工具</h3>
                    
                    <div onclick="window.open('https://forms.gle/CizB4A9W6t6Wn4sq8', '_blank')" class="bg-white rounded-2xl p-4 flex items-center justify-between cursor-pointer hover:bg-gray-50 transition-colors active:scale-95 shadow-sm border border-gray-100">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl drop-shadow-sm">📝</span>
                            <span class="font-bold text-gray-700">追星周邊紀錄</span>
                        </div>
                        <span class="text-[#92A8D1] font-bold text-sm">前往 &raquo;</span>
                    </div>

                    <h3 class="text-xs font-black text-gray-400 mb-2 mt-6 uppercase tracking-wider px-1">系統設定 (自動儲存)</h3>
                    
                    <div class="bg-white border border-gray-100 rounded-2xl p-4 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <span class="text-xl">💰</span>
                            <span class="font-bold text-gray-600 text-sm">每月預算 (NT$)</span>
                        </div>
                        <input type="number" id="budget-input" onchange="saveBudget()" placeholder="20000" class="w-24 bg-gray-50 border border-gray-200 rounded-lg px-2 py-1 text-right text-sm font-bold outline-none focus:border-[#92A8D1]">
                    </div>

                    <div class="bg-white border border-gray-100 rounded-2xl p-4 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <span class="text-xl">💱</span>
                            <span class="font-bold text-gray-600 text-sm">韓元即時匯率</span>
                        </div>
                        <span id="live-rate-display" class="text-[10px] font-bold text-[#92A8D1] bg-[#92A8D1]/10 px-2 py-1 rounded">連線中...</span>
                    </div>

                    <!-- 🌟 全新：分類與付款管理入口 -->
                    <div onclick="openManageModal()" class="bg-white border border-gray-100 rounded-2xl p-4 flex items-center justify-between cursor-pointer hover:bg-gray-50 transition-colors active:scale-95 mt-2">
                        <div class="flex items-center gap-3">
                            <span class="text-xl">⚙️</span>
                            <span class="font-bold text-gray-600 text-sm">分類與付款管理</span>
                        </div>
                        <span class="text-gray-400 font-bold text-lg">&rsaquo;</span>
                    </div>

                    <div onclick="exportToCSV()" class="bg-white border border-gray-100 rounded-2xl p-4 flex items-center justify-between cursor-pointer hover:bg-green-50 transition-colors active:scale-95 mt-2">
                        <div class="flex items-center gap-3">
                            <span class="text-xl">📥</span>
                            <span class="font-bold text-gray-600 text-sm">匯出為 Excel (CSV)</span>
                        </div>
                        <span class="text-green-500 font-bold text-lg">&rsaquo;</span>
                    </div>
                </div>
            </div>
        </main>

        <div id="modal-input" class="fixed inset-0 z-[70] flex flex-col justify-end hidden-view">
            <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
            
            <div id="modal-scroll-area" class="relative bg-gray-50 rounded-t-[32px] p-6 shadow-xl h-[90vh] overflow-y-auto animate-slide-up no-scrollbar pb-12">
                <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-4"></div>
                <button onclick="closeModal()" class="absolute top-5 right-6 w-8 h-8 bg-gray-200 rounded-full text-gray-500 hover:bg-gray-300 flex items-center justify-center font-bold transition-colors">&times;</button>
                <h2 id="modal-title" class="text-lg font-black text-gray-800 mb-5 ml-1">新增紀錄 💸</h2>
                
                <form id="ledger-form" class="space-y-4">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 focus-within:border-[#92A8D1] transition-colors">
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">金額</label>
                        <div class="flex items-center">
                            <select id="currency" class="bg-gray-50 text-gray-700 px-3 py-2 rounded-lg font-bold outline-none border-none text-sm mr-3">
                                <option value="KRW">₩ KRW</option>
                                <option value="TWD">$ TWD</option>
                            </select>
                            <input type="number" id="amount" inputmode="decimal" placeholder="0" required 
                                class="flex-1 w-full text-3xl font-black text-[#92A8D1] outline-none bg-transparent placeholder-gray-300">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                            <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">日期</label>
                            <input type="date" id="record_date" required class="w-full font-bold text-sm text-gray-700 outline-none bg-transparent">
                        </div>
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                            <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">付款/入帳</label>
                            <select id="payment_method" onchange="handlePaymentChange(this)" class="w-full font-bold text-sm text-gray-700 outline-none bg-transparent"></select>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                        <label class="block text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider">選擇分類</label>
                        <div class="grid grid-cols-4 gap-3 mb-4" id="expense-categories"></div>
                        <div class="border-t border-dashed border-gray-200 pt-3">
                            <div class="grid grid-cols-4 gap-3" id="income-categories"></div>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 focus-within:border-[#F7CAC9] transition-colors">
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">備註 (選填)</label>
                        <input type="text" id="note" placeholder="寫點什麼..." class="w-full font-bold text-sm text-gray-700 outline-none bg-transparent placeholder-gray-300">
                    </div>

                    <div class="flex gap-3 mt-4 pb-4">
                        <button type="button" id="btn-delete" onclick="deleteRecord()" class="hidden-view w-14 bg-red-50 text-red-500 rounded-2xl flex items-center justify-center font-bold transition-transform active:scale-95 text-xl">🗑️</button>
                        <button type="submit" id="btn-submit" class="flex-1 bg-gradient-to-r from-[#92A8D1] to-[#F7CAC9] text-white font-bold py-4 rounded-2xl shadow-lg shadow-[#92A8D1]/30 transition-transform active:scale-95 text-lg">儲存</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="modal-drilldown" class="fixed inset-0 z-[60] flex flex-col justify-end hidden-view">
            <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm transition-opacity" onclick="closeDrilldownModal()"></div>
            <div class="relative bg-gray-50 rounded-t-[32px] p-6 shadow-xl h-[90vh] overflow-y-auto animate-slide-up no-scrollbar pb-12">
                <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-4"></div>
                <button onclick="closeDrilldownModal()" class="absolute top-5 right-6 w-8 h-8 bg-gray-200 rounded-full text-gray-500 hover:bg-gray-300 flex items-center justify-center font-bold transition-colors">&times;</button>
                <h2 id="drilldown-title" class="text-lg font-black text-gray-800 mb-5 ml-1 bg-gradient-to-r from-[#92A8D1] to-[#F7CAC9] bg-clip-text text-transparent">明細總覽</h2>
                <div id="drilldown-list" class="space-y-3 pb-6 overflow-hidden"></div>
            </div>
        </div>

        <!-- 🌟 全新：分類與付款管理彈窗 -->
        <div id="modal-manage" class="fixed inset-0 z-[80] flex flex-col justify-end hidden-view">
            <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm transition-opacity" onclick="closeManageModal()"></div>
            <div class="relative bg-gray-50 rounded-t-[32px] p-6 shadow-xl h-[90vh] overflow-y-auto animate-slide-up no-scrollbar pb-12">
                <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-4"></div>
                <button onclick="closeManageModal()" class="absolute top-5 right-6 w-8 h-8 bg-gray-200 rounded-full text-gray-500 hover:bg-gray-300 flex items-center justify-center font-bold transition-colors">&times;</button>
                <h2 class="text-lg font-black text-gray-800 mb-5 ml-1">分類與付款管理 ⚙️</h2>
                
                <h3 class="text-xs font-black text-[#92A8D1] mb-2 uppercase tracking-wider px-1">付款方式列表</h3>
                <div id="manage-payment-list" class="space-y-2 mb-6"></div>

                <h3 class="text-xs font-black text-[#F7CAC9] mb-2 uppercase tracking-wider px-1">記帳分類列表</h3>
                <div id="manage-category-list" class="space-y-2 pb-6"></div>
            </div>
        </div>

        <button onclick="openAddModal()" class="fixed bottom-28 left-1/2 transform -translate-x-1/2 w-16 h-16 bg-gradient-to-tr from-[#92A8D1] to-[#F7CAC9] rounded-full flex justify-center items-center text-white shadow-[0_4px_15px_rgba(146,168,209,0.4)] z-50 active:scale-95 transition-transform border-4 border-gray-50">
            <span class="text-3xl font-black mb-1">+</span>
        </button>

        <nav class="fixed bottom-0 w-full max-w-md bg-white/95 backdrop-blur-md border-t border-gray-100 flex justify-between items-center px-4 pt-2 pb-6 z-40">
            <button onclick="switchTab('calendar')" id="tab-calendar" class="flex flex-col items-center p-2 text-[#92A8D1] transition-colors w-1/4">
                <span class="text-xl mb-1">📅</span><span class="text-[10px] font-bold">記帳本</span>
            </button>
            <button onclick="switchTab('stats')" id="tab-stats" class="flex flex-col items-center p-2 text-gray-400 transition-colors w-1/4">
                <span class="text-xl mb-1">📊</span><span class="text-[10px] font-bold">分析</span>
            </button>
            <button onclick="switchTab('wallet')" id="tab-wallet" class="flex flex-col items-center p-2 text-gray-400 transition-colors w-1/4">
                <span class="text-xl mb-1">💳</span><span class="text-[10px] font-bold">錢包</span>
            </button>
            <button onclick="switchTab('tools')" id="tab-tools" class="flex flex-col items-center p-2 text-gray-400 transition-colors w-1/4">
                <span class="text-xl mb-1">💎</span><span class="text-[10px] font-bold">克拉島</span>
            </button>
        </nav>

    </div>

    <div id="delete-modal" class="hidden-view fixed inset-0 z-[100] flex items-center justify-center bg-gray-900/40 backdrop-blur-sm p-6">
        <div class="bg-white rounded-3xl p-6 shadow-2xl w-full max-w-sm">
            <h3 class="text-lg font-black text-gray-800 mb-2">確定要刪除嗎？</h3>
            <p class="text-sm text-gray-500 font-medium mb-6">這筆紀錄刪除後將無法復原，確定要執行嗎？</p>
            <div class="flex gap-3">
                <button onclick="hideDeleteConfirm()" class="flex-1 bg-gray-100 text-gray-600 font-bold py-3 rounded-xl">取消</button>
                <button onclick="executeDelete()" class="flex-1 bg-red-400 text-white font-bold py-3 rounded-xl shadow-lg shadow-red-400/30">確定刪除</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nzfarouccowfgytpmnlp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56ZmFyb3VjY293Zmd5dHBtbmxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyMjkyMTEsImV4cCI6MjA5ODgwNTIxMX0.k49Zn7tGNGMKyrG91QpaCYRM4T848ORx0L9ROh_CqNI';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let KRW_RATE = 0.024; 
        
        async function fetchLiveExchangeRate() {
            try {
                const res = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/krw.json');
                const data = await res.json();
                if (data && data.krw && data.krw.twd) {
                    KRW_RATE = data.krw.twd;
                    document.getElementById('live-rate-display').innerHTML = `1 韓元 = <b>${KRW_RATE.toFixed(4)}</b> 台幣 (即時)`;
                }
            } catch(e) {
                document.getElementById('live-rate-display').innerText = `1 韓元 = 0.0240 台幣 (離線預設)`;
            }
        }

        function getLocalDateStr(date = new Date()) {
            const tzOffset = date.getTimezoneOffset() * 60000;
            return new Date(date.getTime() - tzOffset).toISOString().split('T')[0];
        }

        let allRecords = []; 
        let selectedDateStr = getLocalDateStr(); 
        let currentEditingId = null;
        let myCalendar = null; 
        let calendarDisplayCurrency = 'TWD'; 

        const defaultPayments = ['CUBE卡', '富邦J卡', 'UNIOPEN卡', '韓國卡', '現金', 'LINE PAY', '銀行帳戶'];
        let paymentMethods = JSON.parse(localStorage.getItem('cbank_payments')) || defaultPayments;

        function renderPaymentMethods() {
            let html = '';
            paymentMethods.forEach(p => { html += `<option value="${p}">${p}</option>`; });
            html += `<option value="ADD_NEW" class="text-[#92A8D1] font-bold">➕ 新增付款方式...</option>`;
            document.getElementById('payment_method').innerHTML = html;
        }

        function handlePaymentChange(select) {
            if (select.value === 'ADD_NEW') {
                const newPay = prompt('請輸入新的付款方式：\n(例如：🍎 Apple Pay)');
                if (newPay) {
                    paymentMethods.push(newPay);
                    localStorage.setItem('cbank_payments', JSON.stringify(paymentMethods));
                    renderPaymentMethods();
                    select.value = newPay;
                } else {
                    select.value = paymentMethods[0];
                }
            }
        }
        
        // 🌟 最強 15 + 3 黃金陣容
        const defaultCategories = {

                if (diffX < 0) { 
                    let move = Math.max(diffX, -80); activeSwipeItem.style.transform = `translateX(${move}px)`;
                } else if (diffX > 0 && activeSwipeItem.style.transform.includes('-80')) { 
                    let move = Math.min(-80 + diffX, 0); activeSwipeItem.style.transform = `translateX(${move}px)`;

        function renderCalendarBadgesAndTotal(year, monthIndex) {
            let monthExpense = 0; let monthIncome = 0; const dateMap = {};
            const targetYear = String(year); const targetMonth = String(monthIndex + 1).padStart(2, '0');
            allRecords.forEach(r => {
                const isInc = incomeCategories.includes(r.category); const [rYear, rMonth] = r.record_date.split('-');
                let valTwd = r.amount_twd; let valKrw = r.currency === 'KRW' ? r.amount : Math.round(r.amount / KRW_RATE);
                if(rYear === targetYear && rMonth === targetMonth) { 
                    if(isInc) monthIncome += (calendarDisplayCurrency === 'TWD' ? valTwd : valKrw); 
                    else monthExpense += (calendarDisplayCurrency === 'TWD' ? valTwd : valKrw); 
                }
                if (!dateMap[r.record_date]) dateMap[r.record_date] = { net_TWD: 0, net_KRW: 0 };
                if(isInc) { dateMap[r.record_date].net_TWD += valTwd; dateMap[r.record_date].net_KRW += valKrw; } 
                else { dateMap[r.record_date].net_TWD -= valTwd; dateMap[r.record_date].net_KRW -= valKrw; }
            });

            const prefix = calendarDisplayCurrency === 'TWD' ? 'NT$' : '₩';
            document.getElementById('month-total-expense').innerText = `${prefix} ${monthExpense.toLocaleString()}`;
            document.getElementById('month-total-income').innerText = `${prefix} ${monthIncome.toLocaleString()}`;
            document.querySelectorAll('.day-cost, .day-income').forEach(el => el.remove());
            
            Object.keys(dateMap).forEach(date => {
                const dayEl = document.querySelector(`[data-calendar-day="${date}"]`);
                const netVal = calendarDisplayCurrency === 'TWD' ? dateMap[date].net_TWD : dateMap[date].net_KRW;
                if (dayEl && netVal !== 0) {
                    const isNetIncome = netVal > 0; const badge = document.createElement('div');
                    badge.className = isNetIncome ? 'day-cost day-income' : 'day-cost';
                    const absVal = Math.abs(netVal); const signPrefix = isNetIncome ? '+' : '';
                    badge.innerText = `${signPrefix}${absVal.toLocaleString()}`;
                    dayEl.appendChild(badge);
                }
            });
        }

        async function loadStatsData() {
            const year = currentStatsDate.getFullYear(); const month = String(currentStatsDate.getMonth() + 1).padStart(2, '0');
            document.getElementById('stats-month-label').innerText = `${year} / ${month}`;
            const startDate = `${year}-${month}-01`; const endDate = new Date(year, currentStatsDate.getMonth() + 1, 0).toISOString().split('T')[0];
            const { data } = await db.from('ledger').select('*').gte('record_date', startDate).lte('record_date', endDate);
            
            let totalExpense = 0; let totalTwdForBudget = 0; const sums = {};
            data.filter(item => !incomeCategories.includes(item.category)).forEach(item => {
                let valToAdd = displayCurrency === 'TWD' ? item.amount_twd : (item.currency === 'KRW' ? item.amount : Math.round(item.amount / KRW_RATE));
                totalExpense += valToAdd; 
                totalTwdForBudget += item.amount_twd; 
                sums[item.category] = (sums[item.category] || 0) + valToAdd;
            });
            
            const budget = Number(localStorage.getItem('svt_budget')) || 20000;
            const progress = Math.min((totalTwdForBudget / budget) * 100, 100).toFixed(1);
            document.getElementById('budget-text').innerText = `${totalTwdForBudget.toLocaleString()} / ${budget.toLocaleString()}`;
            document.getElementById('budget-percentage').innerText = `${progress}%`;
            
            const barEl = document.getElementById('budget-bar');
            const msgEl = document.getElementById('budget-message');
            barEl.style.width = `${progress}%`;
            
            // 🌟 降低恥度，正常微甜的預算提醒
            if(progress > 80) {
                barEl.className = 'h-full rounded-full transition-all duration-700 bg-red-400';
                msgEl.className = 'text-xs font-bold text-red-500 bg-red-50 p-2.5 rounded-xl text-center transition-all duration-500';
                msgEl.innerText = '🍒 預算即將超支，勝哲說不能再亂花錢囉！';
            } else if(progress > 50) {
                barEl.className = 'h-full rounded-full transition-all duration-700 bg-orange-400';
                msgEl.className = 'text-xs font-bold text-orange-500 bg-orange-50 p-2.5 rounded-xl text-center transition-all duration-500';
                msgEl.innerText = '🍒 預算已經過半，請注意接下來的花費。';
            } else {
                barEl.className = 'h-full rounded-full transition-all duration-700 bg-gradient-to-r from-[#92A8D1] to-[#F7CAC9]';
                msgEl.className = 'text-xs font-bold text-[#6A85B6] bg-[#E8EEF9] p-2.5 rounded-xl text-center transition-all duration-500';
                msgEl.innerText = '🍒 預算控制得很完美，繼續保持！';
            }

            const prefix = displayCurrency === 'TWD' ? 'NT$' : '₩';
            document.getElementById('stats-total-text').innerText = totalExpense.toLocaleString();
            const sortedCategories = Object.keys(sums).sort((a, b) => sums[b] - sums[a]);
            const labels = []; const values = []; const bgColors = []; let listHTML = '';

            sortedCategories.forEach(cat => {
                const val = sums[cat]; const percentage = totalExpense > 0 ? Math.round((val / totalExpense) * 100) : 0;
                const conf = categoryConfig[cat] || { icon: '📝', color: '#000' };
                labels.push(cat); values.push(val); bgColors.push(conf.color);
                
                listHTML += `
                <div onclick="openCategoryDetailsModal('${cat}')" class="cursor-pointer bg-white rounded-[16px] shadow-sm border border-gray-50 flex items-center justify-between p-3 mb-2 transition-all hover:border-[#92A8D1]/30 active:scale-98">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center text-xl" style="background-color: ${conf.color}30;">${conf.icon}</div>
                        <span class="font-black text-gray-700 text-sm">${cat}</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-xs font-bold text-gray-400 w-8 text-right">${percentage}%</span>
                        <span class="font-black text-gray-800 text-sm w-20 text-right">${prefix}${val.toLocaleString()}</span>
                    </div>
                </div>`;
            });
            if(totalExpense === 0) listHTML = `<div class="text-center text-gray-400 py-6 text-sm font-bold">這個月還沒有支出紀錄喔！</div>`;
            document.getElementById('stats-list').innerHTML = listHTML;
            const svtChartColors = ['#92A8D1', '#F7CAC9', '#FDE047', '#A7F3D0', '#E5E7EB', '#C084FC', '#818CF8', '#FDBA74', '#FDA4AF', '#D8B4E2', '#9CA3AF', '#FBCFE8', '#34D399', '#FCA5A5'];
            const ctx = document.getElementById('myDonutChart').getContext('2d');
            if (myDonutChart) myDonutChart.destroy(); 
            myDonutChart = new Chart(ctx, { type: 'doughnut', data: { labels: labels, datasets: [{ data: values.length > 0 ? values : [1], backgroundColor: values.length > 0 ? svtChartColors.slice(0, labels.length) : ['#f3f4f6'], borderWidth: 0, hoverOffset: 4 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '72%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(context) { if(totalExpense === 0) return ' 無資料'; return ` ${prefix}${context.parsed.toLocaleString()}`; } } } } } });
        }

        let currentWalletDate = new Date();
        function changeWalletMonth(delta) { currentWalletDate.setMonth(currentWalletDate.getMonth() + delta); loadWalletData(); }

        async function loadWalletData() {
            const year = currentWalletDate.getFullYear(); const month = String(currentWalletDate.getMonth() + 1).padStart(2, '0');
            document.getElementById('wallet-month-label').innerText = `${year} / ${month}`;
            const startDate = `${year}-${month}-01`; const endDate = new Date(year, currentWalletDate.getMonth() + 1, 0).toISOString().split('T')[0];
            const { data } = await db.from('ledger').select('*').gte('record_date', startDate).lte('record_date', endDate);
            
            const paySums = {}; let totalTwd = 0;
            data.filter(item => !incomeCategories.includes(item.category)).forEach(item => {
                const method = item.payment_method || '未分類';
                paySums[method] = (paySums[method] || 0) + item.amount_twd; totalTwd += item.amount_twd;
            });
            let listHTML = '';
            Object.keys(paySums).sort((a, b) => paySums[b] - paySums[a]).forEach(method => {
                listHTML += `
                <div onclick="openWalletDetailsModal('${method}')" class="cursor-pointer bg-white rounded-[16px] shadow-sm border border-gray-100 flex items-center justify-between p-4 mb-3 transition-all hover:border-[#92A8D1]/30 active:scale-98">
                    <span class="font-bold text-gray-700 text-sm">${method}</span>
                    <span class="font-black text-[#92A8D1] text-base">NT$ ${paySums[method].toLocaleString()}</span>
                </div>`;
            });
            if (totalTwd === 0) listHTML = `<div class="text-center text-gray-400 py-10 text-sm font-bold">這個月還沒有花費喔！</div>`;
            document.getElementById('wallet-list').innerHTML = listHTML;
        }

        function openCategoryDetailsModal(cat) {
            const year = currentStatsDate.getFullYear(); const month = String(currentStatsDate.getMonth() + 1).padStart(2, '0');
            const targetPrefix = `${year}-${month}`;
            const records = allRecords.filter(r => r.record_date.startsWith(targetPrefix) && r.category === cat && !incomeCategories.includes(r.category));
            renderDrilldownList(`🍽️ ${cat} · 當月明細總覽`, records);
        }

        function openWalletDetailsModal(method) {
            const year = currentWalletDate.getFullYear(); const month = String(currentWalletDate.getMonth() + 1).padStart(2, '0');
            const targetPrefix = `${year}-${month}`;
            const records = allRecords.filter(r => r.record_date.startsWith(targetPrefix) && r.payment_method === method && !incomeCategories.includes(r.category));
            renderDrilldownList(`💳 ${method} · 當月刷卡明細`, records);
        }

        function renderDrilldownList(title, records) {
            document.getElementById('drilldown-title').innerText = title;
            const container = document.getElementById('drilldown-list');
            records.sort((a, b) => {
                const dateA = new Date(a.record_date).getTime(); const dateB = new Date(b.record_date).getTime();
                if (dateA !== dateB) return dateB - dateA; return b.id - a.id; 
            });
            if (records.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 py-12 font-bold text-sm">這個月此項目沒有任何紀錄喔！</div>`;
            } else {
                let html = '';
                records.forEach(r => {
                    const conf = categoryConfig[r.category] || { icon: '📝', color: '#94a3b8' };
                    
                    const isKrw = r.currency === 'KRW';
                    const displayAmt = isKrw ? `₩${r.amount.toLocaleString()}` : `NT$${r.amount.toLocaleString()}`;

                    const d = new Date(r.record_date); const days = ['日', '一', '二', '三', '四', '五', '六'];
                    const dateDisplay = `${d.getMonth()+1}/${d.getDate()} (週${days[d.getDay()]})`;
                    const noteHtml = r.note ? `<span class="text-gray-500 font-bold ml-1">${r.note}</span>` : '';
                    html += `
                        <div class="relative mb-3 rounded-[16px] bg-red-50 border border-transparent overflow-hidden">
                            <div class="absolute inset-y-0 right-0 w-20 flex flex-col items-center justify-center text-red-500 font-black text-2xl cursor-pointer z-0" onclick="confirmDirectDelete(event, '${r.id}')">
                                <span class="active:scale-90 transition-transform">🗑️</span>
                            </div>
                            <div onclick="handleItemClick(event, '${r.id}')" class="swipeable-item relative z-10 bg-white rounded-[16px] p-4 flex items-center justify-between shadow-sm border border-gray-100 hover:border-[#92A8D1]/30 cursor-pointer">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full flex items-center justify-center text-xl shrink-0" style="background-color: ${conf.color}30;">${conf.icon}</div>
                                    <div class="truncate">
                                        <div class="font-black text-gray-800 text-sm mb-0.5">${r.category}</div>
                                        <div class="text-[10px] text-gray-400 truncate pr-2">${dateDisplay} ${noteHtml}</div>
                                    </div>
                                </div>
                                <div class="text-right shrink-0 pl-2">
                                    <div class="font-black text-gray-700 text-sm mb-0.5">-${displayAmt}</div>
                                    <div class="text-[9px] font-bold text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded mt-1 inline-block">${r.payment_method}</div>
                                </div>
                            </div>
                        </div>`;
                });
                container.innerHTML = html;
            }
            document.getElementById('modal-drilldown').classList.remove('hidden-view');
        }

        function closeDrilldownModal() { document.getElementById('modal-drilldown').classList.add('hidden-view'); }

        function executeSearch() {
            const keyword = document.getElementById('search-input').value.toLowerCase().trim();
            const container = document.getElementById('search-results-list');
            const toolsMenu = document.getElementById('tools-menu');
            if (!keyword) {
                container.classList.add('hidden-view'); toolsMenu.classList.remove('hidden-view'); return;
            }
            toolsMenu.classList.add('hidden-view'); container.classList.remove('hidden-view');
            const results = allRecords.filter(r => 
                (r.note && r.note.toLowerCase().includes(keyword)) ||
                (r.category && r.category.toLowerCase().includes(keyword)) ||
                (r.payment_method && r.payment_method.toLowerCase().includes(keyword))
            );
            results.sort((a, b) => {
                const dateA = new Date(a.record_date).getTime(); const dateB = new Date(b.record_date).getTime();
                if (dateA !== dateB) return dateB - dateA; return b.id - a.id; 
            });
            if (results.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 py-10 text-sm font-bold">找不到相關紀錄 🥲</div>`;
                return;
            }
            let html = `<div class="text-xs font-black text-gray-400 mb-3 px-1">💎 找到 ${results.length} 筆紀錄</div>`;
            results.forEach(r => {
                const conf = categoryConfig[r.category] || { icon: '📝', color: '#94a3b8' };
                
                const isKrw = r.currency === 'KRW';
                const displayAmt = isKrw ? `₩${r.amount.toLocaleString()}` : `NT$${r.amount.toLocaleString()}`;
                
                const isInc = incomeCategories.includes(r.category);
                const amountColor = isInc ? 'text-green-500' : 'text-gray-700'; const sign = isInc ? '+' : '-';
                const d = new Date(r.record_date); const days = ['日', '一', '二', '三', '四', '五', '六'];
                const dateDisplay = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} (週${days[d.getDay()]})`;
                const noteHtml = r.note ? `<span class="text-gray-500 font-bold ml-1">${r.note}</span>` : '';

                html += `
                    <div class="relative mb-3 rounded-2xl bg-red-50 border border-transparent overflow-hidden">
                        <div class="absolute inset-y-0 right-0 w-20 flex flex-col items-center justify-center text-red-500 font-black text-2xl cursor-pointer z-0" onclick="confirmDirectDelete(event, '${r.id}')">
                            <span class="active:scale-90 transition-transform">🗑️</span>
                        </div>
                        <div onclick="handleItemClick(event, '${r.id}')" class="swipeable-item relative z-10 bg-white rounded-2xl p-4 flex items-center justify-between shadow-sm border border-gray-100 hover:border-[#92A8D1]/30 cursor-pointer">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full flex items-center justify-center text-xl shrink-0" style="background-color: ${conf.color}30;">${conf.icon}</div>
                                <div class="truncate">
                                    <div class="font-black text-gray-800 text-sm mb-0.5">${r.category}</div>
                                    <div class="text-[10px] text-gray-400 truncate pr-2">${dateDisplay} ${noteHtml}</div>
                                </div>
                            </div>
                            <div class="text-right shrink-0 pl-2">
                                <div class="font-black ${amountColor} text-sm mb-0.5">${sign}${displayAmt}</div>
                                <div class="text-[9px] font-bold text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded mt-1 inline-block">${r.payment_method}</div>
                            </div>
                        </div>
                    </div>`;
            });
            container.innerHTML = html;
        }
    </script>
</body>
</html>
