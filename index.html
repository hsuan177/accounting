    <style>
        body { touch-action: manipulation; }
        .hidden-view { display: none !important; }
        
        .vc-day { min-height: 65px !important; position: relative; padding-top: 4px; }
        .vanilla-calendar-day__btn { align-items: flex-start !important; justify-content: center !important; }
        
        .vanilla-calendar-day__btn_selected {
            background-color: #92A8D1 !important;
            color: white !important;
            box-shadow: 0 4px 10px rgba(146, 168, 209, 0.4) !important;
        }
        .vanilla-calendar-day__btn_today {
            color: #F7CAC9 !important;
            background-color: #FFF0F0 !important;
        }
        
        .day-cost { 
            position: absolute; 
            bottom: 4px; 
            left: 50%; 
            transform: translateX(-50%); 
            font-size: 8.5px; 
            letter-spacing: -0.3px;
            color: white; 
            font-weight: bold; 
            background: linear-gradient(to right, #92A8D1, #F7CAC9);
            border-radius: 4px; 
            padding: 1px 3px; 
            text-align: center; 
            width: 90%; 
            line-height: 1.1; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            pointer-events: none; 
            box-shadow: 0 2px 4px rgba(146, 168, 209, 0.3);
        }
        .day-income {
            background: linear-gradient(to right, #4ade80, #22c55e);
            box-shadow: 0 2px 4px rgba(34, 197, 94, 0.3);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-32 relative selection:bg-[#F7CAC9] selection:text-white">

<div onclick="window.open('https://forms.gle/CizB4A9W6t6Wn4sq8', '_blank')" class="bg-gray-50 rounded-2xl p-4 flex items-center justify-between cursor-pointer hover:bg-[#F7CAC9]/20 transition-colors active:scale-95 border border-dashed border-gray-300">

        <div id="modal-input" class="fixed inset-0 z-[60] flex flex-col justify-end hidden-view">

    <script>
        const SUPABASE_URL = 'https://nzfarouccowfgytpmnlp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56ZmFyb3VjY293Zmd5dHBtbmxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyMjkyMTEsImV4cCI6MjA5ODgwNTIxMX0.k49Zn7tGNGMKyrG91QpaCYRM4T848ORx0L9ROh_CqNI';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const KRW_RATE = 0.024; 
        
        function getLocalDateStr(date = new Date()) {
            const tzOffset = date.getTimezoneOffset() * 60000;
            return new Date(date.getTime() - tzOffset).toISOString().split('T')[0];
        }

        let allRecords = []; 
        let selectedDateStr = getLocalDateStr(); 
        let currentEditingId = null;
        let myCalendar = null; 
        let calendarDisplayCurrency = 'TWD'; 

        const incomeCategories = ['生活費', '退款'];
        const categoryConfig = {
            '飲食': { icon: '🍽️', color: '#F7CAC9', type: 'expense' }, 
            '交通': { icon: '🚇', color: '#92A8D1', type: 'expense' }, 
            '購物': { icon: '🛍️', color: '#FDE047', type: 'expense' }, 
            '娛樂': { icon: '🎤', color: '#C084FC', type: 'expense' }, 
            '日用': { icon: '🧴', color: '#A7F3D0', type: 'expense' }, 
            '學習': { icon: '📚', color: '#FDBA74', type: 'expense' }, 
            '醫療': { icon: '💊', color: '#FDA4AF', type: 'expense' }, 
            '其他': { icon: '🪙', color: '#E5E7EB', type: 'expense' },
            '生活費': { icon: '💌', color: '#4ade80', type: 'income' }, 
            '退款': { icon: '🧾', color: '#22c55e', type: 'income' }     
        };

        function renderCategoryGrid() {
            let expenseHtml = '';
            let incomeHtml = '';
            Object.keys(categoryConfig).forEach(cat => {
                const conf = categoryConfig[cat];
                const html = `
                    <label class="cursor-pointer group">
                        <input type="radio" name="category" value="${cat}" class="peer hidden" ${cat === '飲食' ? 'checked' : ''}>
                        <div class="py-3 px-1 rounded-2xl bg-gray-50 border-2 border-transparent peer-checked:bg-[#92A8D1] peer-checked:text-white transition-all flex flex-col items-center gap-1 group-active:scale-95 shadow-sm peer-checked:shadow-[#92A8D1]/40">
                            <span class="text-2xl transition-transform peer-checked:scale-110 drop-shadow-sm">${conf.icon}</span>
                            <span class="text-[10px] font-bold text-gray-500 peer-checked:text-white">${cat}</span>
                        </div>
                    </label>
                `;
                if (conf.type === 'expense') expenseHtml += html;
                else incomeHtml += html;
            });
            document.getElementById('expense-categories').innerHTML = expenseHtml;
            document.getElementById('income-categories').innerHTML = incomeHtml;
        }

        function changeCalendarCurrency(currency) {
            calendarDisplayCurrency = currency;
            document.getElementById('btn-cal-twd').className = currency === 'TWD' ? 'px-2 py-1 rounded bg-white text-[#92A8D1] shadow-sm transition-all' : 'px-2 py-1 text-gray-400 transition-all';
            document.getElementById('btn-cal-krw').className = currency === 'KRW' ? 'px-2 py-1 rounded bg-white text-[#92A8D1] shadow-sm transition-all' : 'px-2 py-1 text-gray-400 transition-all';
            const year = myCalendar ? myCalendar.selectedYear : new Date().getFullYear();
            const monthIndex = myCalendar ? myCalendar.selectedMonth : new Date().getMonth(); 
            renderCalendarBadgesAndTotal(year, monthIndex);
        }

        function openAddModal() { 
            currentEditingId = null; 
            document.getElementById('modal-title').innerText = '新增紀錄 💸';
            document.getElementById('btn-submit').innerText = '儲存';
            document.getElementById('btn-delete').classList.add('hidden-view'); 
            document.getElementById('amount').value = '';
            document.getElementById('note').value = '';
            document.getElementById('record_date').value = selectedDateStr;
            const defaultRadio = document.querySelector('input[name="category"][value="飲食"]');
            if(defaultRadio) defaultRadio.checked = true;
            document.getElementById('modal-input').classList.remove('hidden-view'); 
        }

        function openEditModal(id) {
            currentEditingId = id; 
            const record = allRecords.find(r => String(r.id) === String(id));
            if(!record) return;
            document.getElementById('currency').value = record.currency;
            document.getElementById('amount').value = record.amount;
            document.getElementById('payment_method').value = record.payment_method;
            document.getElementById('record_date').value = record.record_date;
            document.getElementById('note').value = record.note || '';
            const catRadio = document.querySelector(`input[name="category"][value="${record.category}"]`);
            if(catRadio) catRadio.checked = true;
            document.getElementById('modal-title').innerText = '編輯紀錄 ✍️';
            document.getElementById('btn-submit').innerText = '儲存修改';
            document.getElementById('btn-delete').classList.remove('hidden-view'); 
            document.getElementById('modal-input').classList.remove('hidden-view');
        }

        function closeModal() { document.getElementById('modal-input').classList.add('hidden-view'); }

        function switchTab(tabName) {
            document.querySelectorAll('main').forEach(m => m.classList.add('hidden-view'));
            document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-[#92A8D1]', 'text-gray-400'));
            document.getElementById('view-' + tabName).classList.remove('hidden-view');
            document.getElementById('tab-' + tabName).classList.replace('text-gray-400', 'text-[#92A8D1]');
            if(tabName === 'calendar') fetchAndRenderAll();
            if(tabName === 'stats') loadStatsData();
            if(tabName === 'wallet') loadWalletData();
            if(tabName === 'tools') {
                // 回到克拉島時重置狀態
                document.getElementById('search-input').value = ''; 
                executeSearch();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderCategoryGrid(); 
            document.getElementById('record_date').value = selectedDateStr;
            myCalendar = new VanillaCalendar('#calendar', {
                settings: { lang: 'zh-TW', selection: { day: 'single' }, iso8601: false },
                actions: {
                    clickDay(event, self) {
                        const target = event.target.closest('[data-calendar-day]');
                        if (target && target.dataset.calendarDay) {
                            selectedDateStr = target.dataset.calendarDay;
                            document.getElementById('record_date').value = selectedDateStr;
                            renderDailyDetails(selectedDateStr);
                            setTimeout(() => { renderCalendarBadgesAndTotal(self.selectedYear, self.selectedMonth); }, 50);
                        }
                    },
                    changeMonth(event, self) {
                        setTimeout(() => renderCalendarBadgesAndTotal(self.selectedYear, self.selectedMonth), 50);
                    }
                }
            });
            myCalendar.init();
            fetchAndRenderAll();
        });

        document.getElementById('ledger-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const selectedCategory = document.querySelector('input[name="category"]:checked').value;
            const record = {
                currency: document.getElementById('currency').value,
                amount: Number(document.getElementById('amount').value),
                payment_method: document.getElementById('payment_method').value,
                record_date: document.getElementById('record_date').value,
                category: selectedCategory, 
                note: document.getElementById('note').value,
            };
            record.amount_twd = record.currency === 'KRW' ? Math.round(record.amount * KRW_RATE) : record.amount;
            selectedDateStr = record.record_date; 
            if (currentEditingId) {
                await db.from('ledger').update(record).eq('id', currentEditingId);
            } else {
                await db.from('ledger').insert([record]);
            }
            closeModal(); fetchAndRenderAll(); closeDrilldownModal(); 
            if(!document.getElementById('view-tools').classList.contains('hidden-view')) executeSearch();
        });

        function deleteRecord() { document.getElementById('delete-modal').classList.remove('hidden-view'); }
        function hideDeleteConfirm() { document.getElementById('delete-modal').classList.add('hidden-view'); }
        async function executeDelete() {
            if(!currentEditingId) return;
            await db.from('ledger').delete().eq('id', currentEditingId);
            hideDeleteConfirm(); closeModal(); fetchAndRenderAll(); closeDrilldownModal();
            if(!document.getElementById('view-tools').classList.contains('hidden-view')) executeSearch();
        }

        async function fetchAndRenderAll() {
            const { data: records } = await db.from('ledger').select('*').order('record_date', { ascending: false });
            if (!records) return; 
            allRecords = records;
            const year = myCalendar ? myCalendar.selectedYear : new Date().getFullYear();
            const monthIndex = myCalendar ? myCalendar.selectedMonth : new Date().getMonth(); 
            renderCalendarBadgesAndTotal(year, monthIndex);
            renderDailyDetails(selectedDateStr);
        }

        function renderCalendarBadgesAndTotal(year, monthIndex) {
            let monthExpense = 0; let monthIncome = 0; const dateMap = {};
            const targetYear = String(year); const targetMonth = String(monthIndex + 1).padStart(2, '0');
            allRecords.forEach(r => {
                const isInc = incomeCategories.includes(r.category); const [rYear, rMonth] = r.record_date.split('-');
                let valTwd = r.amount_twd; let valKrw = r.currency === 'KRW' ? r.amount : Math.round(r.amount / KRW_RATE);
                
                if(rYear === targetYear && rMonth === targetMonth) { 
                    if(isInc) monthIncome += (calendarDisplayCurrency === 'TWD' ? valTwd : valKrw); 
                    else monthExpense += (calendarDisplayCurrency === 'TWD' ? valTwd : valKrw); 
                }
                if (!dateMap[r.record_date]) dateMap[r.record_date] = { net_TWD: 0, net_KRW: 0 };
                if(isInc) { dateMap[r.record_date].net_TWD += valTwd; dateMap[r.record_date].net_KRW += valKrw; } 
                else { dateMap[r.record_date].net_TWD -= valTwd; dateMap[r.record_date].net_KRW -= valKrw; }
            });

            const prefix = calendarDisplayCurrency === 'TWD' ? 'NT$' : '₩';
            document.getElementById('month-total-expense').innerText = `${prefix} ${monthExpense.toLocaleString()}`;
            document.getElementById('month-total-income').innerText = `${prefix} ${monthIncome.toLocaleString()}`;
            document.querySelectorAll('.day-cost, .day-income').forEach(el => el.remove());
            
            Object.keys(dateMap).forEach(date => {
                const dayEl = document.querySelector(`[data-calendar-day="${date}"]`);
                const netVal = calendarDisplayCurrency === 'TWD' ? dateMap[date].net_TWD : dateMap[date].net_KRW;
                if (dayEl && netVal !== 0) {
                    const isNetIncome = netVal > 0; const badge = document.createElement('div');
                    badge.className = isNetIncome ? 'day-cost day-income' : 'day-cost';
                    const absVal = Math.abs(netVal); const signPrefix = isNetIncome ? '+' : '';
                    badge.innerText = `${signPrefix}${absVal.toLocaleString()}`;
                    dayEl.appendChild(badge);
                }
            });
        }

        function renderDailyDetails(dateStr) {
            const container = document.getElementById('daily-details-container');
            const dailyRecords = allRecords.filter(r => r.record_date === dateStr);
            const d = new Date(dateStr); const days = ['日', '一', '二', '三', '四', '五', '六'];
            const dateTitle = `${d.getMonth()+1}/${d.getDate()} (週${days[d.getDay()]})`;
            if (dailyRecords.length === 0) {
                container.innerHTML = `<div class="flex justify-between items-center px-4 mb-2"><div class="font-black text-gray-800 text-sm">${dateTitle}</div></div><div class="bg-white rounded-[20px] shadow-sm border border-gray-100 p-6 text-center text-gray-400 text-sm font-bold">這天沒有花費紀錄喔！🏝️</div>`;
                return;
            }
            let dailyExpenseTwd = 0; let dailyIncomeTwd = 0; let listHTML = '';
            dailyRecords.forEach(r => {
                const isInc = incomeCategories.includes(r.category); if(isInc) dailyIncomeTwd += r.amount_twd; else dailyExpenseTwd += r.amount_twd;
                const conf = categoryConfig[r.category] || { icon: '📝', color: '#94a3b8' }; const noteDisplay = r.note ? r.note : r.category;
                const displayAmt = r.currency === 'KRW' ? `₩${r.amount.toLocaleString()}` : `NT$${r.amount.toLocaleString()}`;
                const amountColor = isInc ? 'text-green-500' : 'text-gray-700'; const sign = isInc ? '+' : '-';
                listHTML += `
                    <div onclick="openEditModal('${r.id}')" class="cursor-pointer bg-white rounded-[20px] shadow-sm border border-gray-100 p-4 flex items-center justify-between mb-3 transition-transform active:scale-95 hover:border-[#92A8D1]/30">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full flex items-center justify-center text-2xl" style="background-color: ${conf.color}30;">${conf.icon}</div>
                            <div><div class="font-black text-gray-800 text-sm mb-0.5">${r.category}</div><div class="text-xs text-gray-400 font-bold">${noteDisplay}</div></div>
                        </div>
                        <div class="text-right">
                            <div class="font-black ${amountColor} text-base mb-0.5">${sign}${displayAmt}</div>
                            <div class="text-[10px] font-bold text-gray-400 uppercase bg-gray-100 inline-block px-2 py-0.5 rounded-sm">${r.payment_method}</div>
                        </div>
                    </div>`;
            });
            container.innerHTML = `<div class="flex justify-between items-center px-4 mb-3"><div class="font-black text-gray-800 text-sm">${dateTitle}</div><div class="font-bold text-gray-500 text-xs">支出: NT$${dailyExpenseTwd.toLocaleString()} | 收入: NT$${dailyIncomeTwd.toLocaleString()}</div></div>` + listHTML;
        }

        let currentStatsDate = new Date(); let myDonutChart = null; let displayCurrency = 'TWD'; 
        function changeStatsMonth(delta) { currentStatsDate.setMonth(currentStatsDate.getMonth() + delta); loadStatsData(); }
        function changeStatsCurrency(currency) {
            displayCurrency = currency;
            document.getElementById('btn-stats-twd').className = currency === 'TWD' ? 'px-5 py-1.5 rounded-md bg-white text-[#92A8D1] shadow transition-all' : 'px-5 py-1.5 rounded-md text-gray-400 transition-all';
            document.getElementById('btn-stats-krw').className = currency === 'KRW' ? 'px-5 py-1.5 rounded-md bg-white text-[#92A8D1] shadow transition-all' : 'px-5 py-1.5 rounded-md text-gray-400 transition-all';
            loadStatsData(); 
        }

        async function loadStatsData() {
            const year = currentStatsDate.getFullYear(); const month = String(currentStatsDate.getMonth() + 1).padStart(2, '0');
            document.getElementById('stats-month-label').innerText = `${year} / ${month}`;
            const startDate = `${year}-${month}-01`; const endDate = new Date(year, currentStatsDate.getMonth() + 1, 0).toISOString().split('T')[0];
            const { data } = await db.from('ledger').select('*').gte('record_date', startDate).lte('record_date', endDate);
            
            let totalExpense = 0; const sums = {};
            data.filter(item => !incomeCategories.includes(item.category)).forEach(item => {
                let valToAdd = displayCurrency === 'TWD' ? item.amount_twd : (item.currency === 'KRW' ? item.amount : Math.round(item.amount / KRW_RATE));
                totalExpense += valToAdd; sums[item.category] = (sums[item.category] || 0) + valToAdd;
            });
            const prefix = displayCurrency === 'TWD' ? 'NT$' : '₩';
            document.getElementById('stats-total-text').innerText = totalExpense.toLocaleString();
            const sortedCategories = Object.keys(sums).sort((a, b) => sums[b] - sums[a]);
            const labels = []; const values = []; const bgColors = []; let listHTML = '';

            sortedCategories.forEach(cat => {
                const val = sums[cat]; const percentage = totalExpense > 0 ? Math.round((val / totalExpense) * 100) : 0;
                const conf = categoryConfig[cat] || { icon: '📝', color: '#000' };
                labels.push(cat); values.push(val); bgColors.push(conf.color);
                
                listHTML += `
                <div onclick="openCategoryDetailsModal('${cat}')" class="cursor-pointer bg-white rounded-[16px] shadow-sm border border-gray-50 flex items-center justify-between p-3 mb-2 transition-all hover:border-[#92A8D1]/30 active:scale-98">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center text-xl" style="background-color: ${conf.color}30;">${conf.icon}</div>
                        <span class="font-black text-gray-700 text-sm">${cat}</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-xs font-bold text-gray-400 w-8 text-right">${percentage}%</span>
                        <span class="font-black text-gray-800 text-sm w-20 text-right">${prefix}${val.toLocaleString()}</span>
                    </div>
                </div>`;
            });
            if(totalExpense === 0) listHTML = `<div class="text-center text-gray-400 py-6 text-sm font-bold">這個月還沒有支出紀錄喔！</div>`;
            document.getElementById('stats-list').innerHTML = listHTML;
            const svtChartColors = ['#92A8D1', '#F7CAC9', '#FDE047', '#A7F3D0', '#E5E7EB', '#C084FC', '#FDBA74', '#FDA4AF'];
            const ctx = document.getElementById('myDonutChart').getContext('2d');
            if (myDonutChart) myDonutChart.destroy(); 
            myDonutChart = new Chart(ctx, { type: 'doughnut', data: { labels: labels, datasets: [{ data: values.length > 0 ? values : [1], backgroundColor: values.length > 0 ? svtChartColors : ['#f3f4f6'], borderWidth: 0, hoverOffset: 4 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '72%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(context) { if(totalExpense === 0) return ' 無資料'; return ` ${prefix}${context.parsed.toLocaleString()}`; } } } } } });
        }

        let currentWalletDate = new Date();
        function changeWalletMonth(delta) { currentWalletDate.setMonth(currentWalletDate.getMonth() + delta); loadWalletData(); }

        async function loadWalletData() {
            const year = currentWalletDate.getFullYear(); const month = String(currentWalletDate.getMonth() + 1).padStart(2, '0');
            document.getElementById('wallet-month-label').innerText = `${year} / ${month}`;
            const startDate = `${year}-${month}-01`; const endDate = new Date(year, currentWalletDate.getMonth() + 1, 0).toISOString().split('T')[0];
            const { data } = await db.from('ledger').select('*').gte('record_date', startDate).lte('record_date', endDate);
            
            const paySums = {}; let totalTwd = 0;
            data.filter(item => !incomeCategories.includes(item.category)).forEach(item => {
                const method = item.payment_method || '未分類';
                paySums[method] = (paySums[method] || 0) + item.amount_twd; totalTwd += item.amount_twd;
            });
            let listHTML = '';
            Object.keys(paySums).sort((a, b) => paySums[b] - paySums[a]).forEach(method => {
                listHTML += `
                <div onclick="openWalletDetailsModal('${method}')" class="cursor-pointer bg-white rounded-[16px] shadow-sm border border-gray-100 flex items-center justify-between p-4 mb-3 transition-all hover:border-[#92A8D1]/30 active:scale-98">
                    <span class="font-bold text-gray-700 text-sm">${method}</span>
                    <span class="font-black text-[#92A8D1] text-base">NT$ ${paySums[method].toLocaleString()}</span>
                </div>`;
            });
            if (totalTwd === 0) listHTML = `<div class="text-center text-gray-400 py-10 text-sm font-bold">這個月還沒有花費喔！</div>`;
            document.getElementById('wallet-list').innerHTML = listHTML;
        }

        function openCategoryDetailsModal(cat) {
            const year = currentStatsDate.getFullYear(); const month = String(currentStatsDate.getMonth() + 1).padStart(2, '0');
            const targetPrefix = `${year}-${month}`;
            const records = allRecords.filter(r => r.record_date.startsWith(targetPrefix) && r.category === cat && !incomeCategories.includes(r.category));
            renderDrilldownList(`🍽️ ${cat} · 當月明細總覽`, records);
        }

        function openWalletDetailsModal(method) {
            const year = currentWalletDate.getFullYear(); const month = String(currentWalletDate.getMonth() + 1).padStart(2, '0');
            const targetPrefix = `${year}-${month}`;
            const records = allRecords.filter(r => r.record_date.startsWith(targetPrefix) && r.payment_method === method && !incomeCategories.includes(r.category));
            renderDrilldownList(`💳 ${method} · 當月刷卡明細`, records);
        }

        function renderDrilldownList(title, records) {
            document.getElementById('drilldown-title').innerText = title;
            const container = document.getElementById('drilldown-list');
            records.sort((a, b) => {
                const dateA = new Date(a.record_date).getTime(); const dateB = new Date(b.record_date).getTime();
                if (dateA !== dateB) return dateB - dateA; return b.id - a.id; 
            });
            if (records.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 py-12 font-bold text-sm">這個月此項目沒有任何紀錄喔！</div>`;
            } else {
                let html = '';
                records.forEach(r => {
                    const conf = categoryConfig[r.category] || { icon: '📝', color: '#94a3b8' };
                    const displayAmt = r.currency === 'KRW' ? `₩${r.amount.toLocaleString()}` : `NT$${r.amount.toLocaleString()}`;
                    const d = new Date(r.record_date); const days = ['日', '一', '二', '三', '四', '五', '六'];
                    const dateDisplay = `${d.getMonth()+1}/${d.getDate()} (週${days[d.getDay()]})`;
                    const noteHtml = r.note ? `<span class="text-gray-500 font-bold ml-1">${r.note}</span>` : '';
                    html += `
                        <div onclick="openEditModal('${r.id}')" class="cursor-pointer bg-white rounded-2xl p-4 flex items-center justify-between shadow-sm border border-gray-100 hover:border-[#92A8D1]/30 active:scale-95 transition-all">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full flex items-center justify-center text-xl" style="background-color: ${conf.color}30;">${conf.icon}</div>
                                <div><div class="font-black text-gray-800 text-sm mb-0.5">${r.category}</div><div class="text-[10px] text-gray-400">${dateDisplay} ${noteHtml}</div></div>
                            </div>
                            <div class="text-right">
                                <div class="font-black text-gray-700 text-sm">-${displayAmt}</div>
                                <div class="text-[9px] font-bold text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded mt-1 inline-block">${r.payment_method}</div>
                            </div>
                        </div>`;
                });
                container.innerHTML = html;
            }
            document.getElementById('modal-drilldown').classList.remove('hidden-view');
        }

        function closeDrilldownModal() { document.getElementById('modal-drilldown').classList.add('hidden-view'); }

        // ==================== 🌟 搜尋與百寶箱切換邏輯 ====================
        function executeSearch() {
            const keyword = document.getElementById('search-input').value.toLowerCase().trim();
            const container = document.getElementById('search-results-list');
            const toolsMenu = document.getElementById('tools-menu');
            
            // 如果沒輸入字：顯示克拉百寶箱，隱藏搜尋結果
            if (!keyword) {
                container.classList.add('hidden-view');
                toolsMenu.classList.remove('hidden-view');
                return;
            }

            // 只要一打字：隱藏百寶箱，開始顯示搜尋結果
            toolsMenu.classList.add('hidden-view');
            container.classList.remove('hidden-view');

            const results = allRecords.filter(r => 
                (r.note && r.note.toLowerCase().includes(keyword)) ||
                (r.category && r.category.toLowerCase().includes(keyword)) ||
                (r.payment_method && r.payment_method.toLowerCase().includes(keyword))
            );

            results.sort((a, b) => {
                const dateA = new Date(a.record_date).getTime(); const dateB = new Date(b.record_date).getTime();
                if (dateA !== dateB) return dateB - dateA; return b.id - a.id; 
            });

            if (results.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 py-10 text-sm font-bold">找不到相關紀錄 🥲 勝哲說不能亂花錢！</div>`;
                return;
            }

            let html = `<div class="text-xs font-black text-gray-400 mb-3 px-1">💎 找到 ${results.length} 筆紀錄</div>`;
            results.forEach(r => {
                const conf = categoryConfig[r.category] || { icon: '📝', color: '#94a3b8' };
                const displayAmt = r.currency === 'KRW' ? `₩${r.amount.toLocaleString()}` : `NT$${r.amount.toLocaleString()}`;
                const isInc = incomeCategories.includes(r.category);
                const amountColor = isInc ? 'text-green-500' : 'text-gray-700'; const sign = isInc ? '+' : '-';
                const d = new Date(r.record_date); const days = ['日', '一', '二', '三', '四', '五', '六'];
                const dateDisplay = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} (週${days[d.getDay()]})`;
                const noteHtml = r.note ? `<span class="text-gray-500 font-bold ml-1">${r.note}</span>` : '';

                html += `
                    <div onclick="openEditModal('${r.id}')" class="cursor-pointer bg-white rounded-2xl p-4 flex items-center justify-between shadow-sm border border-gray-100 hover:border-[#92A8D1]/30 active:scale-95 transition-all mb-3">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center text-xl" style="background-color: ${conf.color}30;">${conf.icon}</div>
                            <div><div class="font-black text-gray-800 text-sm mb-0.5">${r.category}</div><div class="text-[10px] text-gray-400">${dateDisplay} ${noteHtml}</div></div>
                        </div>
                        <div class="text-right">
                            <div class="font-black ${amountColor} text-sm">${sign}${displayAmt}</div>
                            <div class="text-[9px] font-bold text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded mt-1 inline-block">${r.payment_method}</div>
                        </div>
                    </div>`;
            });
            container.innerHTML = html;
        }
    </script>
</body>
</html>
