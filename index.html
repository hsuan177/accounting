<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首爾留學記帳本</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.jsdelivr.net/npm/vanilla-calendar-pro/build/vanilla-calendar.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vanilla-calendar-pro/build/vanilla-calendar.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        .hidden-view { display: none !important; }
        .vc-day { min-height: 60px !important; display: flex; flex-direction: column; justify-content: flex-start; padding-top: 2px; }
        .vc-day-content { font-size: 14px; font-weight: bold; }
        .day-cost { font-size: 10px; color: white; font-weight: bold; background-color: #ef4444; border-radius: 4px; padding: 1px 4px; margin-top: auto; margin-bottom: 2px; text-align: center; width: 90%; line-height: 1.2;}
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-24">

    <div class="max-w-md mx-auto bg-gray-50 min-h-screen shadow-lg relative overflow-x-hidden">
        
        <header class="bg-[#1E2A25] text-white p-4 text-center rounded-b-3xl sticky top-0 z-40 shadow-md">
            <h1 class="text-xl font-bold tracking-widest">留學記帳本</h1>
            <p class="text-[10px] text-gray-300 mt-1">韓國生活 · 雙幣雲端同步</p>
        </header>

        <main id="view-calendar" class="p-4">
            <div class="bg-white rounded-[24px] shadow-sm border border-gray-100 p-3 mb-4">
                <div id="calendar" class="w-full"></div>
                <div class="flex justify-center text-sm mt-3 pt-3 border-t border-gray-100">
                    <div class="text-center w-1/2">
                        <div class="text-[10px] text-gray-400 font-bold tracking-wider mb-1">本月總支出</div>
                        <div id="month-total-expense" class="font-black text-[#ef4444] text-base">NT$ 0</div>
                    </div>
                </div>
            </div>

            <div id="daily-details-container" class="space-y-3 pb-6"></div>
        </main>

        <main id="view-stats" class="p-4 hidden-view">
            <div class="bg-white rounded-[24px] shadow-sm border border-gray-100 p-5">
                <div class="flex justify-between items-center mb-4">
                    <button onclick="changeStatsMonth(-1)" class="p-2 text-gray-500 hover:bg-gray-100 rounded-full font-bold">&lt;</button>
                    <h2 id="stats-month-label" class="text-lg font-bold text-gray-800">2026 / 07</h2>
                    <button onclick="changeStatsMonth(1)" class="p-2 text-gray-500 hover:bg-gray-100 rounded-full font-bold">&gt;</button>
                </div>

                <div class="flex justify-center mb-6">
                    <div class="bg-gray-100 p-1 rounded-lg flex text-sm font-bold shadow-inner">
                        <button id="btn-stats-twd" onclick="changeStatsCurrency('TWD')" class="px-5 py-1.5 rounded-md bg-white text-[#1F6F54] shadow transition-all">台幣 NT$</button>
                        <button id="btn-stats-krw" onclick="changeStatsCurrency('KRW')" class="px-5 py-1.5 rounded-md text-gray-400 transition-all">韓元 ₩</button>
                    </div>
                </div>

                <div class="relative w-52 h-52 mx-auto mb-6">
                    <canvas id="myDonutChart" class="absolute inset-0 z-10"></canvas>
                    <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none z-0 mt-2">
                        <div id="stats-total-label" class="text-[10px] text-gray-500 font-bold mb-0.5">總支出 (NT$)</div>
                        <div id="stats-total-text" class="text-xl font-black text-gray-800">0</div>
                    </div>
                </div>

                <div id="stats-list" class="space-y-3 mt-4 border-t pt-4"></div>
            </div>
        </main>

        <main id="view-tools" class="p-4 hidden-view">
            <div class="bg-white rounded-[24px] shadow-sm border border-gray-100 p-8 text-center mt-4">
                <div class="text-5xl mb-4">🎒</div>
                <h2 class="text-lg font-bold text-gray-800 mb-2">留學百寶箱</h2>
                <p class="text-xs text-gray-500 leading-relaxed">
                    預留空間。<br>未來可以加入「匯率計算機」、「帳戶餘額」等進階小工具。
                </p>
            </div>
        </main>

        <div id="modal-input" class="fixed inset-0 z-[60] flex flex-col justify-end hidden-view">
            <div class="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
            
            <div class="relative bg-gray-50 rounded-t-[32px] p-6 shadow-2xl h-[85vh] overflow-y-auto animate-slide-up">
                <button onclick="closeModal()" class="absolute top-5 right-6 w-8 h-8 bg-gray-200 rounded-full text-gray-500 hover:bg-gray-300 flex items-center justify-center font-bold transition-colors">&times;</button>
                
                <h2 id="modal-title" class="text-lg font-black text-gray-800 mb-5 ml-1">新增一筆紀錄 💸</h2>
                
                <form id="ledger-form" class="space-y-4">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">金額</label>
                        <div class="flex items-center">
                            <select id="currency" class="bg-gray-100 text-gray-700 px-3 py-2 rounded-lg font-bold outline-none border-none text-sm mr-3">
                                <option value="KRW">₩ KRW</option>
                                <option value="TWD">$ TWD</option>
                            </select>
                            <input type="number" id="amount" placeholder="0" required 
                                class="flex-1 w-full text-3xl font-black text-gray-800 outline-none bg-transparent placeholder-gray-300">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                            <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">付款方式</label>
                            <select id="payment_method" class="w-full font-bold text-sm text-gray-700 outline-none bg-transparent">
                                <option value="現金">💵 現金</option>
                                <option value="韓國卡">💳 韓國卡</option>
                                <option value="台灣刷卡">✈️ 台灣刷卡</option>
                                <option value="行動支付">📱 Line Pay/Apple Pay</option>
                            </select>
                        </div>
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                            <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">日期</label>
                            <input type="date" id="record_date" required
                                class="w-full font-bold text-sm text-gray-700 outline-none bg-transparent">
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">分類</label>
                        <select id="category" class="w-full font-bold text-sm text-gray-700 outline-none bg-transparent">
                            <option value="餐費">🍔 飲食餐費</option>
                            <option value="交通">🚇 交通地鐵</option>
                            <option value="購物">🛍️ 購物娛樂</option>
                            <option value="住宿/學費">🏠 住宿學費</option>
                            <option value="其他">🪙 其他</option>
                        </select>
                    </div>

                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">備註</label>
                        <input type="text" id="note" placeholder="寫點什麼..."
                            class="w-full font-bold text-sm text-gray-700 outline-none bg-transparent placeholder-gray-300">
                    </div>

                    <div class="flex gap-3 mt-6">
                        <button type="button" id="btn-delete" onclick="deleteRecord()" class="hidden-view w-14 bg-red-50 text-red-500 rounded-2xl flex items-center justify-center font-bold transition-transform active:scale-95 text-xl">
                            🗑️
                        </button>
                        <button type="submit" id="btn-submit" class="flex-1 bg-[#1F6F54] hover:bg-[#155a42] text-white font-bold py-4 rounded-2xl shadow-lg shadow-[#1F6F54]/30 transition-transform active:scale-95 text-lg">
                            儲存
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <nav class="fixed bottom-0 w-full max-w-md bg-white/90 backdrop-blur-md border-t border-gray-200 flex justify-between items-center px-4 py-2 z-50">
            <button onclick="switchTab('calendar')" id="tab-calendar" class="flex flex-col items-center p-2 text-[#1F6F54] transition-colors w-1/4">
                <span class="text-xl mb-1">📅</span>
                <span class="text-[10px] font-bold">記帳本</span>
            </button>
            <button onclick="switchTab('stats')" id="tab-stats" class="flex flex-col items-center p-2 text-gray-400 transition-colors w-1/4">
                <span class="text-xl mb-1">📊</span>
                <span class="text-[10px] font-bold">分析</span>
            </button>
            <div class="w-1/4 flex justify-center">
                <button onclick="openAddModal()" class="w-14 h-14 bg-[#1E2A25] rounded-full flex justify-center items-center text-white shadow-xl transform -translate-y-4 transition-transform active:scale-95 border-4 border-white/50">
                    <span class="text-2xl font-black mb-1">+</span>
                </button>
            </div>
            <button onclick="switchTab('tools')" id="tab-tools" class="flex flex-col items-center p-2 text-gray-400 transition-colors w-1/4">
                <span class="text-xl mb-1">🎒</span>
                <span class="text-[10px] font-bold">更多</span>
            </button>
        </nav>

    </div>

    <script>
        const SUPABASE_URL = 'https://nzfarouccowfgytpmnlp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56ZmFyb3VjY293Zmd5dHBtbmxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyMjkyMTEsImV4cCI6MjA5ODgwNTIxMX0.k49Zn7tGNGMKyrG91QpaCYRM4T848ORx0L9ROh_CqNI';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const KRW_RATE = 0.024; 
        
        let allRecords = []; 
        let selectedDateStr = new Date().toISOString().split('T')[0]; 
        let currentEditingId = null;
        let myCalendar = null; // 🌟 解決崩潰的關鍵：把日曆存成全域變數

        const categoryConfig = {
            '餐費': { icon: '🍜', color: '#f43f5e' }, 
            '交通': { icon: '🚇', color: '#3b82f6' }, 
            '購物': { icon: '🛍️', color: '#eab308' }, 
            '住宿/學費': { icon: '🏠', color: '#8b5cf6' }, 
            '其他': { icon: '🪙', color: '#94a3b8' }  
        };

        function openAddModal() { 
            currentEditingId = null; 
            document.getElementById('modal-title').innerText = '新增一筆紀錄 💸';
            document.getElementById('btn-submit').innerText = '儲存';
            document.getElementById('btn-delete').classList.add('hidden-view'); 
            
            document.getElementById('amount').value = '';
            document.getElementById('note').value = '';
            document.getElementById('record_date').value = selectedDateStr;
            document.getElementById('modal-input').classList.remove('hidden-view'); 
        }

        function openEditModal(id) {
            currentEditingId = id; 
            const record = allRecords.find(r => String(r.id) === String(id));
            if(!record) return;

            document.getElementById('currency').value = record.currency;
            document.getElementById('amount').value = record.amount;
            document.getElementById('payment_method').value = record.payment_method;
            document.getElementById('record_date').value = record.record_date;
            document.getElementById('category').value = record.category;
            document.getElementById('note').value = record.note || '';

            document.getElementById('modal-title').innerText = '編輯紀錄 ✍️';
            document.getElementById('btn-submit').innerText = '儲存修改';
            document.getElementById('btn-delete').classList.remove('hidden-view'); 

            document.getElementById('modal-input').classList.remove('hidden-view');
        }

        function closeModal() { document.getElementById('modal-input').classList.add('hidden-view'); }

        function switchTab(tabName) {
            document.getElementById('view-calendar').classList.add('hidden-view');
            document.getElementById('view-stats').classList.add('hidden-view');
            document.getElementById('view-tools').classList.add('hidden-view');
            
            document.getElementById('tab-calendar').classList.replace('text-[#1F6F54]', 'text-gray-400');
            document.getElementById('tab-stats').classList.replace('text-[#1F6F54]', 'text-gray-400');
            document.getElementById('tab-tools').classList.replace('text-[#1F6F54]', 'text-gray-400');

            document.getElementById('view-' + tabName).classList.remove('hidden-view');
            document.getElementById('tab-' + tabName).classList.replace('text-gray-400', 'text-[#1F6F54]');

            if(tabName === 'calendar') fetchAndRenderAll();
            if(tabName === 'stats') loadStatsData();
        }

        // 初始化日曆
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('record_date').value = selectedDateStr;
            myCalendar = new VanillaCalendar('#calendar', {
                settings: { lang: 'zh-TW', selection: { day: 'single' } },
                actions: {
                    clickDay(event, self) {
                        selectedDateStr = self.HTMLElements.day.dataset.calendarDay;
                        renderDailyDetails(selectedDateStr);
                    },
                    changeMonth(event, self) {
                        // 給它一點時間切換畫面後，再貼上金額標籤
                        setTimeout(() => {
                            renderCalendarBadgesAndTotal(self.selectedYear, self.selectedMonth);
                        }, 50);
                    }
                }
            });
            myCalendar.init();
            fetchAndRenderAll();
        });

        // 儲存/更新資料
        document.getElementById('ledger-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const currency = document.getElementById('currency').value;
            const amount = Number(document.getElementById('amount').value);
            const paymentMethod = document.getElementById('payment_method').value;
            const recordDate = document.getElementById('record_date').value;
            const category = document.getElementById('category').value;
            const note = document.getElementById('note').value;

            let amountTwd = amount;
            if (currency === 'KRW') amountTwd = Math.round(amount * KRW_RATE);

            selectedDateStr = recordDate; 
            let errorResult;

            if (currentEditingId) {
                const { error } = await db.from('ledger').update({ 
                    amount: amount, currency: currency, amount_twd: amountTwd, payment_method: paymentMethod, record_date: recordDate, category: category, note: note 
                }).eq('id', currentEditingId);
                errorResult = error;
            } else {
                const { error } = await db.from('ledger').insert([
                    { amount: amount, currency: currency, amount_twd: amountTwd, payment_method: paymentMethod, record_date: recordDate, category: category, note: note }
                ]);
                errorResult = error;
            }

            if (errorResult) {
                alert('❌ 儲存失敗：' + errorResult.message);
            } else {
                closeModal(); 
                fetchAndRenderAll(); 
            }
        });

        // 刪除資料
        async function deleteRecord() {
            if(!currentEditingId) return;
            const confirmDelete = confirm('確定要刪除這筆紀錄嗎？（刪除後無法復原）');
            if(confirmDelete) {
                const { error } = await db.from('ledger').delete().eq('id', currentEditingId);
                if(error) {
                    alert('❌ 刪除失敗：' + error.message);
                } else {
                    closeModal();
                    fetchAndRenderAll();
                }
            }
        }

        // ==================== 📅 日曆與明細聯動核心 (已修復) ====================

        async function fetchAndRenderAll() {
            const { data: records, error } = await db.from('ledger').select('*').order('record_date', { ascending: false });
            if (error || !records) return; // 如果沒抓到資料就安靜退出
            
            allRecords = records;
            
            // 🌟 安全的抓取目前日曆年月：直接問 myCalendar 物件，如果它還沒準備好就抓現在的時間
            const year = myCalendar ? myCalendar.selectedYear : new Date().getFullYear();
            const monthIndex = myCalendar ? myCalendar.selectedMonth : new Date().getMonth(); // 0 到 11
            
            renderCalendarBadgesAndTotal(year, monthIndex);
            renderDailyDetails(selectedDateStr);
        }

// 🌟 修正後的顯示金額貼標籤邏輯 (加入防護機制)
        function renderCalendarBadgesAndTotal(year, monthIndex) {
            let monthTotalTwd = 0;
            const dateMap = {};

            const targetYear = String(year);
            const targetMonth = String(monthIndex + 1).padStart(2, '0');

            allRecords.forEach(r => {
                const [rYear, rMonth] = r.record_date.split('-');
                if(rYear === targetYear && rMonth === targetMonth) {
                    monthTotalTwd += r.amount_twd;
                }

                if (!dateMap[r.record_date]) dateMap[r.record_date] = { TWD: 0, KRW: 0 };
                dateMap[r.record_date][r.currency] += r.amount;
            });

            document.getElementById('month-total-expense').innerText = `NT$ ${monthTotalTwd.toLocaleString()}`;

            // 1. 先清除所有舊標籤
            document.querySelectorAll('.day-cost').forEach(el => el.remove());

            // 2. 只有當格子已經正確產生時，才執行貼上動作
            Object.keys(dateMap).forEach(date => {
                // 檢查該日期格子是否存在
                const dayEl = document.querySelector(`[data-calendar-day="${date}"]`);
                if (dayEl) {
                    const badge = document.createElement('div');
                    badge.className = 'day-cost shadow-sm';
                    if (dateMap[date].KRW > 0) badge.innerText = `₩${dateMap[date].KRW.toLocaleString()}`;
                    else badge.innerText = `$${dateMap[date].TWD.toLocaleString()}`;
                    dayEl.appendChild(badge);
                }
            });
        }

        function renderDailyDetails(dateStr) {
            const container = document.getElementById('daily-details-container');
            const dailyRecords = allRecords.filter(r => r.record_date === dateStr);
            
            const d = new Date(dateStr);
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            const dateTitle = `${d.getMonth()+1}/${d.getDate()} (週${days[d.getDay()]})`;

            if (dailyRecords.length === 0) {
                container.innerHTML = `
                    <div class="flex justify-between items-center px-4 mb-2">
                        <div class="font-black text-gray-800 text-sm">${dateTitle}</div>
                    </div>
                    <div class="bg-white rounded-[20px] shadow-sm border border-gray-100 p-6 text-center text-gray-400 text-sm font-bold">
                        這天沒有花費紀錄喔！🏝️
                    </div>`;
                return;
            }

            let dailyTotalTwd = 0;
            let listHTML = '';

            dailyRecords.forEach(r => {
                dailyTotalTwd += r.amount_twd;
                const conf = categoryConfig[r.category] || { icon: '📝', color: '#94a3b8' };
                const noteDisplay = r.note ? r.note : r.category;
                const displayAmt = r.currency === 'KRW' ? `₩${r.amount.toLocaleString()}` : `NT$${r.amount.toLocaleString()}`;
                const payMethodDisplay = r.payment_method || '';

                listHTML += `
                    <div onclick="openEditModal('${r.id}')" class="cursor-pointer bg-white rounded-[20px] shadow-sm border border-gray-100 p-4 flex items-center justify-between mb-3 transition-transform active:scale-95 hover:border-[#1F6F54]/30">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full flex items-center justify-center text-2xl" style="background-color: ${conf.color}15;">
                                ${conf.icon}
                            </div>
                            <div>
                                <div class="font-black text-gray-800 text-sm mb-0.5">${r.category}</div>
                                <div class="text-xs text-gray-400 font-bold">${noteDisplay}</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="font-black text-[#ef4444] text-base mb-0.5">-${displayAmt}</div>
                            <div class="text-[10px] font-bold text-gray-400 uppercase bg-gray-100 inline-block px-2 py-0.5 rounded-sm">${payMethodDisplay}</div>
                        </div>
                    </div>
                `;
            });

            const headerHTML = `
                <div class="flex justify-between items-center px-4 mb-3">
                    <div class="font-black text-gray-800 text-sm">${dateTitle}</div>
                    <div class="font-bold text-gray-500 text-xs">支出: NT$ ${dailyTotalTwd.toLocaleString()}</div>
                </div>
            `;

            container.innerHTML = headerHTML + listHTML;
        }

        // ==================== 📈 圖表與統計邏輯 ====================
        let currentStatsDate = new Date();
        let myDonutChart = null; 
        let displayCurrency = 'TWD'; 

        function changeStatsMonth(delta) {
            currentStatsDate.setMonth(currentStatsDate.getMonth() + delta);
            loadStatsData();
        }

        function changeStatsCurrency(currency) {
            displayCurrency = currency;
            if (currency === 'TWD') {
                document.getElementById('btn-stats-twd').className = 'px-5 py-1.5 rounded-md bg-white text-[#1F6F54] shadow transition-all';
                document.getElementById('btn-stats-krw').className = 'px-5 py-1.5 rounded-md text-gray-400 transition-all';
            } else {
                document.getElementById('btn-stats-krw').className = 'px-5 py-1.5 rounded-md bg-white text-[#1F6F54] shadow transition-all';
                document.getElementById('btn-stats-twd').className = 'px-5 py-1.5 rounded-md text-gray-400 transition-all';
            }
            loadStatsData(); 
        }

        async function loadStatsData() {
            const year = currentStatsDate.getFullYear();
            const month = String(currentStatsDate.getMonth() + 1).padStart(2, '0');
            document.getElementById('stats-month-label').innerText = `${year} / ${month}`;

            const startDate = `${year}-${month}-01`;
            const endDate = new Date(year, currentStatsDate.getMonth() + 1, 0).toISOString().split('T')[0];

            const { data, error } = await db.from('ledger').select('category, amount, currency, amount_twd')
                                            .gte('record_date', startDate)
                                            .lte('record_date', endDate);
            if (error) return;

            let totalVal = 0;
            const sums = {};

            data.forEach(item => {
                let valToAdd = 0;
                if (displayCurrency === 'TWD') {
                    valToAdd = item.amount_twd; 
                } else {
                    if (item.currency === 'KRW') {
                        valToAdd = item.amount; 
                    } else {
                        valToAdd = Math.round(item.amount / KRW_RATE);
                    }
                }
                totalVal += valToAdd;
                sums[item.category] = (sums[item.category] || 0) + valToAdd;
            });

            const prefix = displayCurrency === 'TWD' ? 'NT$' : '₩';
            document.getElementById('stats-total-label').innerText = displayCurrency === 'TWD' ? '總支出 (NT$)' : '總支出 (KRW)';
            document.getElementById('stats-total-text').innerText = totalVal.toLocaleString();

            const sortedCategories = Object.keys(sums).sort((a, b) => sums[b] - sums[a]);
            const labels = [];
            const values = [];
            const bgColors = [];
            let listHTML = '';

            sortedCategories.forEach(cat => {
                const val = sums[cat];
                const percentage = totalVal > 0 ? Math.round((val / totalVal) * 100) : 0;
                const conf = categoryConfig[cat] || { icon: '📝', color: '#000' };
                
                labels.push(cat);
                values.push(val);
                bgColors.push(conf.color);

                listHTML += `
                <div class="bg-white rounded-[16px] shadow-sm border border-gray-50 flex items-center justify-between p-3 mb-2">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center text-xl" style="background-color: ${conf.color}15;">
                            ${conf.icon}
                        </div>
                        <span class="font-black text-gray-700 text-sm">${cat}</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-xs font-bold text-gray-400 w-8 text-right">${percentage}%</span>
                        <span class="font-black text-gray-800 text-sm w-20 text-right">${prefix}${val.toLocaleString()}</span>
                    </div>
                </div>`;
            });

            if(totalVal === 0) listHTML = `<div class="text-center text-gray-400 py-6 text-sm font-bold">這個月還沒有記帳紀錄喔！</div>`;
            document.getElementById('stats-list').innerHTML = listHTML;

            const ctx = document.getElementById('myDonutChart').getContext('2d');
            if (myDonutChart) myDonutChart.destroy(); 

            myDonutChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values.length > 0 ? values : [1], 
                        backgroundColor: values.length > 0 ? bgColors : ['#f3f4f6'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false, 
                    cutout: '72%', 
                    plugins: {
                        legend: { display: false }, 
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    if(totalVal === 0) return ' 無資料';
                                    return ` ${prefix}${context.parsed.toLocaleString()}`;
                                }
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
