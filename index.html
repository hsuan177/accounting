<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍒 S.COUPS BANK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.jsdelivr.net/npm/vanilla-calendar-pro/build/vanilla-calendar.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vanilla-calendar-pro/build/vanilla-calendar.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { touch-action: manipulation; }
        .hidden-view { display: none !important; }
        
        .vc-day { min-height: 65px !important; position: relative; padding-top: 4px; }
        .vanilla-calendar-day__btn { align-items: flex-start !important; justify-content: center !important; }
        
        .day-cost { 
            position: absolute; 
            bottom: 4px; 
            left: 50%; 
            transform: translateX(-50%); 
            font-size: 9px; 
            color: white; 
            font-weight: bold; 
            background: linear-gradient(to right, #92A8D1, #F7CAC9);
            border-radius: 4px; 
            padding: 2px 4px; 
            text-align: center; 
            width: 85%; 
            line-height: 1.1; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            pointer-events: none; 
            box-shadow: 0 2px 4px rgba(146, 168, 209, 0.3);
        }
        .day-income {
            background: linear-gradient(to right, #4ade80, #22c55e);
            box-shadow: 0 2px 4px rgba(34, 197, 94, 0.3);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* 隱藏捲軸但可滾動 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-32 relative selection:bg-[#F7CAC9] selection:text-white">

    <div class="max-w-md mx-auto bg-gray-50 min-h-screen shadow-lg relative overflow-x-hidden">
        
        <header class="bg-gradient-to-r from-[#92A8D1] to-[#F7CAC9] text-white p-5 text-center sticky top-0 z-40 shadow-md rounded-b-3xl border-b-4 border-white/30">
            <h1 class="text-2xl font-black tracking-widest drop-shadow-md flex justify-center items-center gap-2">
                <span>🍒</span> S.COUPS BANK
            </h1>
        </header>

        <main id="view-calendar" class="p-4">
            <div class="bg-white rounded-[24px] shadow-sm border border-gray-100 p-3 mb-4">
                <div id="calendar" class="w-full"></div>
                <div class="flex justify-around items-center text-sm mt-3 pt-3 border-t border-gray-100">
                    <div class="text-center w-1/2 border-r border-gray-100">
                        <div class="text-[10px] text-gray-400 font-bold tracking-wider mb-1">本月總支出</div>
                        <div id="month-total-expense" class="font-black text-[#92A8D1] text-base">NT$ 0</div>
                    </div>
                    <div class="text-center w-1/2">
                        <div class="text-[10px] text-gray-400 font-bold tracking-wider mb-1">本月總收入</div>
                        <div id="month-total-income" class="font-black text-green-500 text-base">NT$ 0</div>
                    </div>
                </div>
            </div>
            <div id="daily-details-container" class="space-y-3 pb-6"></div>
        </main>

        <main id="view-stats" class="p-4 hidden-view">
            <div class="bg-white rounded-[24px] shadow-sm border border-gray-100 p-5">
                <div class="flex justify-between items-center mb-4">
                    <button onclick="changeStatsMonth(-1)" class="p-2 text-gray-400 hover:text-[#92A8D1] rounded-full font-bold transition-colors">&lt;</button>
                    <h2 id="stats-month-label" class="text-lg font-bold text-gray-800">2026 / 07</h2>
                    <button onclick="changeStatsMonth(1)" class="p-2 text-gray-400 hover:text-[#92A8D1] rounded-full font-bold transition-colors">&gt;</button>
                </div>
                <div class="flex justify-center mb-6">
                    <div class="bg-gray-100 p-1 rounded-lg flex text-sm font-bold shadow-inner">
                        <button id="btn-stats-twd" onclick="changeStatsCurrency('TWD')" class="px-5 py-1.5 rounded-md bg-white text-[#92A8D1] shadow transition-all">台幣 NT$</button>
                        <button id="btn-stats-krw" onclick="changeStatsCurrency('KRW')" class="px-5 py-1.5 rounded-md text-gray-400 transition-all">韓元 ₩</button>
                    </div>
                </div>
                <div class="relative w-52 h-52 mx-auto mb-6">
                    <canvas id="myDonutChart" class="absolute inset-0 z-10"></canvas>
                    <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none z-0 mt-2">
                        <div id="stats-total-label" class="text-[10px] text-gray-500 font-bold mb-0.5">總支出</div>
                        <div id="stats-total-text" class="text-xl font-black text-gray-800">0</div>
                    </div>
                </div>
                <div id="stats-list" class="space-y-3 mt-4 border-t pt-4"></div>
            </div>
        </main>

        <main id="view-wallet" class="p-4 hidden-view">
            <div class="bg-white rounded-[24px] shadow-sm border border-gray-100 p-5">
                <div class="flex justify-between items-center mb-6">
                    <button onclick="changeWalletMonth(-1)" class="p-2 text-gray-400 hover:text-[#92A8D1] rounded-full font-bold transition-colors">&lt;</button>
                    <h2 id="wallet-month-label" class="text-lg font-bold text-gray-800">2026 / 07</h2>
                    <button onclick="changeWalletMonth(1)" class="p-2 text-gray-400 hover:text-[#92A8D1] rounded-full font-bold transition-colors">&gt;</button>
                </div>
                <h3 class="text-xs font-black text-gray-400 mb-4 uppercase tracking-wider px-1">本月各付款方式總額</h3>
                <div id="wallet-list" class="space-y-3"></div>
            </div>
        </main>

        <main id="view-tools" class="p-4 hidden-view">
            <div class="bg-white rounded-[24px] shadow-sm border border-gray-100 p-8 text-center mt-4">
                <div class="text-5xl mb-4">💎</div>
                <h2 class="text-lg font-bold text-gray-800 mb-2">克拉專屬百寶箱</h2>
                <p class="text-xs text-gray-500 leading-relaxed">帶著勝哲的保佑，在韓國好好生活吧！</p>
            </div>
        </main>

        <!-- ==================== 🌟 大幅更新的記帳彈出視窗 ==================== -->
        <div id="modal-input" class="fixed inset-0 z-[60] flex flex-col justify-end hidden-view">
            <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
            
            <div class="relative bg-gray-50 rounded-t-[32px] p-6 shadow-2xl h-[90vh] overflow-y-auto animate-slide-up no-scrollbar">
                <button onclick="closeModal()" class="absolute top-5 right-6 w-8 h-8 bg-gray-200 rounded-full text-gray-500 hover:bg-gray-300 flex items-center justify-center font-bold transition-colors">&times;</button>
                <h2 id="modal-title" class="text-lg font-black text-gray-800 mb-5 ml-1">新增紀錄 💸</h2>
                
                <form id="ledger-form" class="space-y-4">
                    <!-- 第一列：金額 -->
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 focus-within:border-[#92A8D1] transition-colors">
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">金額</label>
                        <div class="flex items-center">
                            <select id="currency" class="bg-gray-50 text-gray-700 px-3 py-2 rounded-lg font-bold outline-none border-none text-sm mr-3">
                                <option value="KRW">₩ KRW</option>
                                <option value="TWD">$ TWD</option>
                            </select>
                            <input type="number" id="amount" inputmode="decimal" placeholder="0" required 
                                class="flex-1 w-full text-3xl font-black text-[#92A8D1] outline-none bg-transparent placeholder-gray-300">
                        </div>
                    </div>

                    <!-- 第二列：日期 (左) + 付款方式 (右) -->
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                            <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">日期</label>
                            <input type="date" id="record_date" required class="w-full font-bold text-sm text-gray-700 outline-none bg-transparent">
                        </div>
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                            <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">付款/入帳</label>
                            <select id="payment_method" class="w-full font-bold text-sm text-gray-700 outline-none bg-transparent">
                                <optgroup label="信用卡">
                                    <option value="CUBE卡">💳 CUBE卡</option>
                                    <option value="富邦J卡">💳 富邦J卡</option>
                                    <option value="UNIOPEN卡">💳 UNIOPEN卡</option>
                                    <option value="韓國卡">🇰🇷 韓國卡</option>
                                </optgroup>
                                <optgroup label="現金與支付">
                                    <option value="現金">💵 現金</option>
                                    <option value="帳戶扣款">🏦 銀行帳戶</option>
                                </optgroup>
                            </select>
                        </div>
                    </div>

                    <!-- 第三列：🌟 全新網格化分類 (超精緻) -->
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                        <label class="block text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider">選擇分類</label>
                        
                        <!-- 支出區塊 -->
                        <div class="grid grid-cols-4 gap-3 mb-4" id="expense-categories">
                            <!-- JS 動態生成 -->
                        </div>

                        <!-- 收入區塊 -->
                        <div class="border-t border-dashed border-gray-200 pt-3">
                            <div class="grid grid-cols-4 gap-3" id="income-categories">
                                <!-- JS 動態生成 -->
                            </div>
                        </div>
                    </div>

                    <!-- 第四列：備註 -->
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 focus-within:border-[#F7CAC9] transition-colors">
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">備註</label>
                        <input type="text" id="note" placeholder="寫點什麼..." class="w-full font-bold text-sm text-gray-700 outline-none bg-transparent placeholder-gray-300">
                    </div>

                    <div class="flex gap-3 mt-6">
                        <button type="button" id="btn-delete" onclick="deleteRecord()" class="hidden-view w-14 bg-red-50 text-red-500 rounded-2xl flex items-center justify-center font-bold transition-transform active:scale-95 text-xl">🗑️</button>
                        <button type="submit" id="btn-submit" class="flex-1 bg-gradient-to-r from-[#92A8D1] to-[#F7CAC9] text-white font-bold py-4 rounded-2xl shadow-lg shadow-[#92A8D1]/30 transition-transform active:scale-95 text-lg">儲存</button>
                    </div>
                </form>
            </div>
        </div>

        <button onclick="openAddModal()" class="fixed bottom-24 left-1/2 transform -translate-x-1/2 w-16 h-16 bg-gradient-to-tr from-[#92A8D1] to-[#F7CAC9] rounded-full flex justify-center items-center text-white shadow-[0_8px_25px_rgba(146,168,209,0.5)] z-50 active:scale-95 transition-transform border-4 border-gray-50">
            <span class="text-3xl font-black mb-1">+</span>
        </button>

        <nav class="fixed bottom-0 w-full max-w-md bg-white/95 backdrop-blur-md border-t border-gray-100 flex justify-between items-center px-4 py-2 z-40">
            <button onclick="switchTab('calendar')" id="tab-calendar" class="flex flex-col items-center p-2 text-[#92A8D1] transition-colors w-1/4">
                <span class="text-xl mb-1">📅</span><span class="text-[10px] font-bold">記帳本</span>
            </button>
            <button onclick="switchTab('stats')" id="tab-stats" class="flex flex-col items-center p-2 text-gray-400 transition-colors w-1/4">
                <span class="text-xl mb-1">📊</span><span class="text-[10px] font-bold">分析</span>
            </button>
            <button onclick="switchTab('wallet')" id="tab-wallet" class="flex flex-col items-center p-2 text-gray-400 transition-colors w-1/4">
                <span class="text-xl mb-1">💳</span><span class="text-[10px] font-bold">錢包</span>
            </button>
            <button onclick="switchTab('tools')" id="tab-tools" class="flex flex-col items-center p-2 text-gray-400 transition-colors w-1/4">
                <span class="text-xl mb-1">🎒</span><span class="text-[10px] font-bold">更多</span>
            </button>
        </nav>

    </div>

    <!-- 刪除確認彈窗 -->
    <div id="delete-modal" class="hidden-view fixed inset-0 z-[100] flex items-center justify-center bg-gray-900/40 backdrop-blur-sm p-6">
        <div class="bg-white rounded-3xl p-6 shadow-2xl w-full max-w-sm">
            <h3 class="text-lg font-black text-gray-800 mb-2">確定要刪除嗎？</h3>
            <p class="text-sm text-gray-500 font-medium mb-6">這筆紀錄刪除後將無法復原，確定要執行嗎？</p>
            <div class="flex gap-3">
                <button onclick="hideDeleteConfirm()" class="flex-1 bg-gray-100 text-gray-600 font-bold py-3 rounded-xl">取消</button>
                <button onclick="executeDelete()" class="flex-1 bg-red-400 text-white font-bold py-3 rounded-xl shadow-lg shadow-red-400/30">確定刪除</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nzfarouccowfgytpmnlp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56ZmFyb3VjY293Zmd5dHBtbmxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyMjkyMTEsImV4cCI6MjA5ODgwNTIxMX0.k49Zn7tGNGMKyrG91QpaCYRM4T848ORx0L9ROh_CqNI';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const KRW_RATE = 0.024; 
        
        let allRecords = []; 
        let selectedDateStr = new Date().toISOString().split('T')[0]; 
        let currentEditingId = null;
        let myCalendar = null; 

        // 🌟 更新的精細分類 (完美解決分支太長的問題)
        const incomeCategories = ['生活費', '退款'];
        
        const categoryConfig = {
            // 支出類
            '早餐': { icon: '🥞', color: '#F7CAC9', type: 'expense' }, 
            '午餐': { icon: '🍱', color: '#F7CAC9', type: 'expense' }, 
            '晚餐': { icon: '🥩', color: '#F7CAC9', type: 'expense' }, 
            '點心': { icon: '🍰', color: '#F7CAC9', type: 'expense' }, 
            '飲料': { icon: '🧋', color: '#F7CAC9', type: 'expense' },
            '交通': { icon: '🚇', color: '#92A8D1', type: 'expense' }, 
            '購物': { icon: '🛍️', color: '#FDE047', type: 'expense' }, 
            '日用': { icon: '🧴', color: '#FDE047', type: 'expense' }, 
            '娛樂': { icon: '🎤', color: '#C084FC', type: 'expense' }, 
            '住宿/學費': { icon: '🏠', color: '#A7F3D0', type: 'expense' }, 
            '其他': { icon: '🪙', color: '#E5E7EB', type: 'expense' },
            // 收入類
            '生活費': { icon: '💌', color: '#4ade80', type: 'income' }, 
            '退款': { icon: '🧾', color: '#22c55e', type: 'income' }     
        };

        // 🌟 自動生成網格 HTML 的函數
        function renderCategoryGrid() {
            let expenseHtml = '';
            let incomeHtml = '';
            
            Object.keys(categoryConfig).forEach(cat => {
                const conf = categoryConfig[cat];
                const html = `
                    <label class="cursor-pointer group">
                        <input type="radio" name="category" value="${cat}" class="peer hidden" ${cat === '午餐' ? 'checked' : ''}>
                        <div class="p-2 rounded-2xl bg-gray-50 border-2 border-transparent peer-checked:bg-[#92A8D1] peer-checked:text-white transition-all flex flex-col items-center gap-1 group-active:scale-95 shadow-sm peer-checked:shadow-[#92A8D1]/40">
                            <span class="text-2xl transition-transform peer-checked:scale-110 drop-shadow-sm">${conf.icon}</span>
                            <span class="text-[10px] font-bold text-gray-500 peer-checked:text-white">${cat}</span>
                        </div>
                    </label>
                `;
                if (conf.type === 'expense') expenseHtml += html;
                else incomeHtml += html;
            });

            document.getElementById('expense-categories').innerHTML = expenseHtml;
            document.getElementById('income-categories').innerHTML = incomeHtml;
        }

        function openAddModal() { 
            currentEditingId = null; 
            document.getElementById('modal-title').innerText = '新增紀錄 💸';
            document.getElementById('btn-submit').innerText = '儲存';
            document.getElementById('btn-delete').classList.add('hidden-view'); 
            document.getElementById('amount').value = '';
            document.getElementById('note').value = '';
            document.getElementById('record_date').value = selectedDateStr;
            
            // 預設選中「午餐」
            const defaultRadio = document.querySelector('input[name="category"][value="午餐"]');
            if(defaultRadio) defaultRadio.checked = true;

            document.getElementById('modal-input').classList.remove('hidden-view'); 
        }

        function openEditModal(id) {
            currentEditingId = id; 
            const record = allRecords.find(r => String(r.id) === String(id));
            if(!record) return;
            
            document.getElementById('currency').value = record.currency;
            document.getElementById('amount').value = record.amount;
            document.getElementById('payment_method').value = record.payment_method;
            document.getElementById('record_date').value = record.record_date;
            document.getElementById('note').value = record.note || '';
            
            // 設定選中的分類網格
            const catRadio = document.querySelector(`input[name="category"][value="${record.category}"]`);
            if(catRadio) catRadio.checked = true;
            else document.querySelector('input[name="category"][value="其他"]').checked = true; // 防呆

            document.getElementById('modal-title').innerText = '編輯紀錄 ✍️';
            document.getElementById('btn-submit').innerText = '儲存修改';
            document.getElementById('btn-delete').classList.remove('hidden-view'); 
            document.getElementById('modal-input').classList.remove('hidden-view');
        }

        function closeModal() { document.getElementById('modal-input').classList.add('hidden-view'); }

        function switchTab(tabName) {
            document.querySelectorAll('main').forEach(m => m.classList.add('hidden-view'));
            document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-[#92A8D1]', 'text-gray-400'));
            document.getElementById('view-' + tabName).classList.remove('hidden-view');
            document.getElementById('tab-' + tabName).classList.replace('text-gray-400', 'text-[#92A8D1]');
            if(tabName === 'calendar') fetchAndRenderAll();
            if(tabName === 'stats') loadStatsData();
            if(tabName === 'wallet') loadWalletData();
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderCategoryGrid(); // 畫面載入時畫出精美的分類網格
            
            document.getElementById('record_date').value = selectedDateStr;
            myCalendar = new VanillaCalendar('#calendar', {
                settings: { lang: 'zh-TW', selection: { day: 'single' } },
                actions: {
                    clickDay(event, self) {
                        const target = event.target.closest('[data-calendar-day]');
                        if (target && target.dataset.calendarDay) {
                            selectedDateStr = target.dataset.calendarDay;
                            document.getElementById('record_date').value = selectedDateStr;
                            renderDailyDetails(selectedDateStr);
                        }
                    },
                    changeMonth(event, self) {
                        setTimeout(() => renderCalendarBadgesAndTotal(self.selectedYear, self.selectedMonth), 50);
                    }
                }
            });
            myCalendar.init();
            fetchAndRenderAll();
        });

        document.getElementById('ledger-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 🌟 抓取被選中的分類按鈕的值
            const selectedCategory = document.querySelector('input[name="category"]:checked').value;

            const record = {
                currency: document.getElementById('currency').value,
                amount: Number(document.getElementById('amount').value),
                payment_method: document.getElementById('payment_method').value,
                record_date: document.getElementById('record_date').value,
                category: selectedCategory, // 使用網格選擇的值
                note: document.getElementById('note').value,
            };
            record.amount_twd = record.currency === 'KRW' ? Math.round(record.amount * KRW_RATE) : record.amount;
            selectedDateStr = record.record_date; 
            
            if (currentEditingId) {
                await db.from('ledger').update(record).eq('id', currentEditingId);
            } else {
                await db.from('ledger').insert([record]);
            }
            closeModal(); fetchAndRenderAll(); 
        });

        function deleteRecord() { document.getElementById('delete-modal').classList.remove('hidden-view'); }
        function hideDeleteConfirm() { document.getElementById('delete-modal').classList.add('hidden-view'); }
        
        async function executeDelete() {
            if(!currentEditingId) return;
            await db.from('ledger').delete().eq('id', currentEditingId);
            hideDeleteConfirm(); closeModal(); fetchAndRenderAll();
        }

        async function fetchAndRenderAll() {
            const { data: records } = await db.from('ledger').select('*').order('record_date', { ascending: false });
            if (!records) return; 
            allRecords = records;
            const year = myCalendar ? myCalendar.selectedYear : new Date().getFullYear();
            const monthIndex = myCalendar ? myCalendar.selectedMonth : new Date().getMonth(); 
            renderCalendarBadgesAndTotal(year, monthIndex);
            renderDailyDetails(selectedDateStr);
        }

        function renderCalendarBadgesAndTotal(year, monthIndex) {
            let monthExpenseTwd = 0;
            let monthIncomeTwd = 0;
            const dateMap = {};
            const targetYear = String(year);
            const targetMonth = String(monthIndex + 1).padStart(2, '0');

            allRecords.forEach(r => {
                const isInc = incomeCategories.includes(r.category);
                const [rYear, rMonth] = r.record_date.split('-');
                
                if(rYear === targetYear && rMonth === targetMonth) {
                    if(isInc) monthIncomeTwd += r.amount_twd;
                    else monthExpenseTwd += r.amount_twd;
                }
                
                if (!dateMap[r.record_date]) dateMap[r.record_date] = { net_TWD: 0, net_KRW: 0 };
                if(isInc) {
                    dateMap[r.record_date].net_TWD += r.amount_twd;
                    dateMap[r.record_date].net_KRW += (r.currency === 'KRW' ? r.amount : Math.round(r.amount / KRW_RATE));
                } else {
                    dateMap[r.record_date].net_TWD -= r.amount_twd;
                    dateMap[r.record_date].net_KRW -= (r.currency === 'KRW' ? r.amount : Math.round(r.amount / KRW_RATE));
                }
            });

            document.getElementById('month-total-expense').innerText = `NT$ ${monthExpenseTwd.toLocaleString()}`;
            document.getElementById('month-total-income').innerText = `NT$ ${monthIncomeTwd.toLocaleString()}`;
            document.querySelectorAll('.day-cost, .day-income').forEach(el => el.remove());

            Object.keys(dateMap).forEach(date => {
                const dayEl = document.querySelector(`[data-calendar-day="${date}"]`);
                if (dayEl && dateMap[date].net_TWD !== 0) {
                    const isNetIncome = dateMap[date].net_TWD > 0;
                    const badge = document.createElement('div');
                    badge.className = isNetIncome ? 'day-cost day-income' : 'day-cost';
                    
                    const absKrw = Math.abs(dateMap[date].net_KRW);
                    const absTwd = Math.abs(dateMap[date].net_TWD);
                    const prefix = isNetIncome ? '+' : '';
                    
                    if (absKrw > 0) badge.innerText = `${prefix}₩${absKrw.toLocaleString()}`;
                    else badge.innerText = `${prefix}$${absTwd.toLocaleString()}`;
                    
                    dayEl.appendChild(badge);
                }
            });
        }

        function renderDailyDetails(dateStr) {
            const container = document.getElementById('daily-details-container');
            const dailyRecords = allRecords.filter(r => r.record_date === dateStr);
            const d = new Date(dateStr);
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            const dateTitle = `${d.getMonth()+1}/${d.getDate()} (週${days[d.getDay()]})`;

            if (dailyRecords.length === 0) {
                container.innerHTML = `<div class="flex justify-between items-center px-4 mb-2"><div class="font-black text-gray-800 text-sm">${dateTitle}</div></div><div class="bg-white rounded-[20px] shadow-sm border border-gray-100 p-6 text-center text-gray-400 text-sm font-bold">這天沒有花費紀錄喔！🏝️</div>`;
                return;
            }

            let dailyExpenseTwd = 0;
            let dailyIncomeTwd = 0;
            let listHTML = '';

            dailyRecords.forEach(r => {
                const isInc = incomeCategories.includes(r.category);
                if(isInc) dailyIncomeTwd += r.amount_twd; else dailyExpenseTwd += r.amount_twd;
                
                const conf = categoryConfig[r.category] || { icon: '📝', color: '#94a3b8' };
                const noteDisplay = r.note ? r.note : r.category;
                const displayAmt = r.currency === 'KRW' ? `₩${r.amount.toLocaleString()}` : `NT$${r.amount.toLocaleString()}`;
                
                const amountColor = isInc ? 'text-green-500' : 'text-gray-700';
                const sign = isInc ? '+' : '-';

                listHTML += `
                    <div onclick="openEditModal('${r.id}')" class="cursor-pointer bg-white rounded-[20px] shadow-sm border border-gray-100 p-4 flex items-center justify-between mb-3 transition-transform active:scale-95 hover:border-[#92A8D1]/30">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full flex items-center justify-center text-2xl" style="background-color: ${conf.color}30;">${conf.icon}</div>
                            <div><div class="font-black text-gray-800 text-sm mb-0.5">${r.category}</div><div class="text-xs text-gray-400 font-bold">${noteDisplay}</div></div>
                        </div>
                        <div class="text-right">
                            <div class="font-black ${amountColor} text-base mb-0.5">${sign}${displayAmt}</div>
                            <div class="text-[10px] font-bold text-gray-500 bg-gray-100 inline-block px-2 py-0.5 rounded-sm">${r.payment_method}</div>
                        </div>
                    </div>`;
            });

            container.innerHTML = `<div class="flex justify-between items-center px-4 mb-3"><div class="font-black text-gray-800 text-sm">${dateTitle}</div><div class="font-bold text-gray-500 text-xs">支出: NT$${dailyExpenseTwd.toLocaleString()} | 收入: NT$${dailyIncomeTwd.toLocaleString()}</div></div>` + listHTML;
        }

        let currentStatsDate = new Date();
        let myDonutChart = null; 
        let displayCurrency = 'TWD'; 

        function changeStatsMonth(delta) { currentStatsDate.setMonth(currentStatsDate.getMonth() + delta); loadStatsData(); }
        function changeStatsCurrency(currency) {
            displayCurrency = currency;
            document.getElementById('btn-stats-twd').className = currency === 'TWD' ? 'px-5 py-1.5 rounded-md bg-white text-[#92A8D1] shadow transition-all' : 'px-5 py-1.5 rounded-md text-gray-400 transition-all';
            document.getElementById('btn-stats-krw').className = currency === 'KRW' ? 'px-5 py-1.5 rounded-md bg-white text-[#92A8D1] shadow transition-all' : 'px-5 py-1.5 rounded-md text-gray-400 transition-all';
            loadStatsData(); 
        }

        async function loadStatsData() {
            const year = currentStatsDate.getFullYear();
            const month = String(currentStatsDate.getMonth() + 1).padStart(2, '0');
            document.getElementById('stats-month-label').innerText = `${year} / ${month}`;
            const startDate = `${year}-${month}-01`;
            const endDate = new Date(year, currentStatsDate.getMonth() + 1, 0).toISOString().split('T')[0];

            const { data } = await db.from('ledger').select('*').gte('record_date', startDate).lte('record_date', endDate);
            
            let totalExpense = 0; const sums = {};
            
            data.filter(item => !incomeCategories.includes(item.category)).forEach(item => {
                let valToAdd = displayCurrency === 'TWD' ? item.amount_twd : (item.currency === 'KRW' ? item.amount : Math.round(item.amount / KRW_RATE));
                totalExpense += valToAdd;
                sums[item.category] = (sums[item.category] || 0) + valToAdd;
            });

            const prefix = displayCurrency === 'TWD' ? 'NT$' : '₩';
            document.getElementById('stats-total-text').innerText = totalExpense.toLocaleString();

            const sortedCategories = Object.keys(sums).sort((a, b) => sums[b] - sums[a]);
            const labels = []; const values = []; const bgColors = [];
            let listHTML = '';

            sortedCategories.forEach(cat => {
                const val = sums[cat];
                const percentage = totalExpense > 0 ? Math.round((val / totalExpense) * 100) : 0;
                const conf = categoryConfig[cat] || { icon: '📝', color: '#000' };
                labels.push(cat); values.push(val); bgColors.push(conf.color);
                listHTML += `<div class="bg-white rounded-[16px] shadow-sm border border-gray-50 flex items-center justify-between p-3 mb-2"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full flex items-center justify-center text-xl" style="background-color: ${conf.color}30;">${conf.icon}</div><span class="font-black text-gray-700 text-sm">${cat}</span></div><div class="flex items-center gap-4"><span class="text-xs font-bold text-gray-400 w-8 text-right">${percentage}%</span><span class="font-black text-gray-800 text-sm w-20 text-right">${prefix}${val.toLocaleString()}</span></div></div>`;
            });

            if(totalExpense === 0) listHTML = `<div class="text-center text-gray-400 py-6 text-sm font-bold">這個月還沒有支出紀錄喔！</div>`;
            document.getElementById('stats-list').innerHTML = listHTML;

            const svtChartColors = ['#92A8D1', '#F7CAC9', '#FDE047', '#A7F3D0', '#E5E7EB', '#C084FC'];
            const ctx = document.getElementById('myDonutChart').getContext('2d');
            if (myDonutChart) myDonutChart.destroy(); 
            myDonutChart = new Chart(ctx, { type: 'doughnut', data: { labels: labels, datasets: [{ data: values.length > 0 ? values : [1], backgroundColor: values.length > 0 ? svtChartColors : ['#f3f4f6'], borderWidth: 0, hoverOffset: 4 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '72%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(context) { if(totalExpense === 0) return ' 無資料'; return ` ${prefix}${context.parsed.toLocaleString()}`; } } } } } });
        }

        let currentWalletDate = new Date();
        function changeWalletMonth(delta) { currentWalletDate.setMonth(currentWalletDate.getMonth() + delta); loadWalletData(); }

        async function loadWalletData() {
            const year = currentWalletDate.getFullYear();
            const month = String(currentWalletDate.getMonth() + 1).padStart(2, '0');
            document.getElementById('wallet-month-label').innerText = `${year} / ${month}`;
            const startDate = `${year}-${month}-01`;
            const endDate = new Date(year, currentWalletDate.getMonth() + 1, 0).toISOString().split('T')[0];

            const { data } = await db.from('ledger').select('*').gte('record_date', startDate).lte('record_date', endDate);
            
            const paySums = {};
            let totalTwd = 0;

            data.filter(item => !incomeCategories.includes(item.category)).forEach(item => {
                const method = item.payment_method || '未分類';
                paySums[method] = (paySums[method] || 0) + item.amount_twd;
                totalTwd += item.amount_twd;
            });

            let listHTML = '';
            Object.keys(paySums).sort((a, b) => paySums[b] - paySums[a]).forEach(method => {
                listHTML += `
                <div class="bg-white rounded-[16px] shadow-sm border border-gray-100 flex items-center justify-between p-4 mb-3 transition-colors hover:border-[#92A8D1]/30">
                    <span class="font-bold text-gray-700 text-sm">${method}</span>
                    <span class="font-black text-[#92A8D1] text-base">NT$ ${paySums[method].toLocaleString()}</span>
                </div>`;
            });

            if (totalTwd === 0) listHTML = `<div class="text-center text-gray-400 py-10 text-sm font-bold">這個月還沒有花費喔！</div>`;
            document.getElementById('wallet-list').innerHTML = listHTML;
        }
    </script>
</body>
</html>
